  --ink: #13283A;          /* sea ink: text and figures */
  --ink-2: #4C5F67;
  --ink-3: #5E6F76;
  --accent: #175A68;       /* controls, links, selected state */
  --accent-ink: #FFFFFF;
  --accent-2: #4A8698;
  --accent-3: #A6C8D1;
  --accent-soft: #DFEEF1;
  --good: #1F6E4B;  --good-soft: #DFF0E7;  --good-sig: #1E8A55;
  --warn: #865B00;  --warn-soft: #FBEFCB;  --warn-sig: #F2B01E;
  --crit: #A83A2C;  --crit-soft: #F9E2DE;  --crit-sig: #C8372A;
  --need: #2C5AA0;  --need-soft: #E2EAF7;  --need-sig: #2D62B5;
  --sign-ink: #FFFFFF;     /* pictogram on a safety sign */
  --sign-ink-warn: #13283A;
  --focus: #175A68;
  --shadow-1: 0 1px 2px rgba(19, 40, 58, 0.06), 0 2px 8px rgba(19, 40, 58, 0.05);
  --shadow-2: 0 12px 40px rgba(19, 40, 58, 0.18);
  --scrim: rgba(13, 27, 33, 0.42);
  /* type */
  --font-body: "FM Sans", "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: "FM Display", "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --fs-cap: 12.5px; --fs-sm: 13.5px; --fs-body: 15px; --fs-lead: 16.5px; --fs-h3: 17px; --fs-h2: 21px; --fs-h1: 30px; --fs-fig: 46px;
  /* shape and rhythm */
  --r-s: 7px; --r-m: 10px; --r-l: 14px;
  --nav-w: 252px;
  --top-h: 60px;
  --tab-h: 64px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1B20; --surface: #16252B; --surface-2: #1D3038; --surface-3: #13222A; --line: #2B3F47; --line-strong: #45585F;
    --ink: #E0EAEC; --ink-2: #A2B1B5; --ink-3: #8C9BA0;
    --accent: #6CB6C4; --accent-ink: #0F1B20; --accent-2: #4C8B99; --accent-3: #2F525B; --accent-soft: #1C353C;
    --good: #5CBF8E; --good-soft: #193127; --good-sig: #2F9A66;
    --warn: #EDBA4E; --warn-soft: #352B14; --warn-sig: #E5A82A;
    --crit: #EE877B; --crit-soft: #3B221F; --crit-sig: #D2493B;
    --need: #8DB0EE; --need-soft: #1E293D; --need-sig: #3C6FC2;
    --sign-ink: #FFFFFF; --sign-ink-warn: #13283A;
    --focus: #6CB6C4; --shadow-1: none; --shadow-2: 0 16px 48px rgba(0, 0, 0, 0.5); --scrim: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1B20; --surface: #16252B; --surface-2: #1D3038; --surface-3: #13222A; --line: #2B3F47; --line-strong: #45585F;
  --ink: #E0EAEC; --ink-2: #A2B1B5; --ink-3: #8C9BA0;
  --accent: #6CB6C4; --accent-ink: #0F1B20; --accent-2: #4C8B99; --accent-3: #2F525B; --accent-soft: #1C353C;
  --good: #5CBF8E; --good-soft: #193127; --good-sig: #2F9A66;
  --warn: #EDBA4E; --warn-soft: #352B14; --warn-sig: #E5A82A;
  --crit: #EE877B; --crit-soft: #3B221F; --crit-sig: #D2493B;
  --need: #8DB0EE; --need-soft: #1E293D; --need-sig: #3C6FC2;
  --sign-ink: #FFFFFF; --sign-ink-warn: #13283A;
  --focus: #6CB6C4; --shadow-1: none; --shadow-2: 0 16px 48px rgba(0, 0, 0, 0.5); --scrim: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--fs-body); line-height: 1.55;
  font-feature-settings: "kern" 1;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1, h2 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.005em; }
h3 { font-size: var(--fs-h3); font-weight: 600; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
.tnum, .num, td.n, .fig { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1[tabindex="-1"]:focus { outline: none; }
.q-rules { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; font-size: var(--fs-sm); color: var(--ink-2); }
.q-rules .sign { margin-top: 1px; }
.muted { color: var(--ink-2); }
.small { font-size: var(--fs-sm); }
.cap { font-size: var(--fs-cap); color: var(--ink-2); }
.src { font-size: var(--fs-cap); color: var(--ink-3); }
.status-good { color: var(--good); } .status-warn { color: var(--warn); } .status-crit { color: var(--crit); } .status-need { color: var(--need); }

/* ------------------------------------------------------------------ top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar-inner {
  display: flex; align-items: center; gap: 14px; min-height: var(--top-h);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px;
}
.wordmark {
  font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: 0.04em; color: var(--ink);
  text-decoration: none; white-space: nowrap; padding: 2px 4px; border-radius: 6px; flex: none;
}
.wordmark:hover { color: var(--accent); }
.case-title { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; padding-left: 14px; border-left: 1px solid var(--line); }
.case-title b { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.case-title span { color: var(--ink-2); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.case-title .tag { display: inline-block; margin-left: 6px; }
.top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: none; }
.top-q { display: none; }

/* ------------------------------------------------------------------ buttons and small controls */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 38px; padding: 7px 14px; border-radius: var(--r-s);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-size: 14.5px; font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: background-color .15s var(--ease), border-color .15s var(--ease), transform .08s var(--ease);
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.quiet:hover { background: var(--surface-2); color: var(--ink); }
.btn.small { min-height: 32px; padding: 4px 11px; font-size: 13.5px; }
.btn.icon { width: 38px; padding: 0; }
.btn.icon.small { width: 32px; }
.btn.danger { color: var(--crit); }
.btn svg { width: 17px; height: 17px; flex: none; }
.lang { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-s); overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 0 10px; min-height: 36px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tag {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; line-height: 1.6;
}
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.crit { background: var(--crit-soft); color: var(--crit); }
.tag.need { background: var(--need-soft); color: var(--need); }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
.count.crit { background: var(--crit-soft); color: var(--crit); }
.count.need { background: var(--need-soft); color: var(--need); }
.count.warn { background: var(--warn-soft); color: var(--warn); }

/* segmented control */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--surface-2); border-radius: 10px; max-width: 100%; }
.seg button {
  border: 0; background: transparent; padding: 6px 12px; min-height: 34px; border-radius: 8px;
  font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap;
  transition: background-color .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease);
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(19, 40, 58, 0.14); }
.seg.small button { min-height: 30px; padding: 4px 10px; font-size: 13px; }
.ctl { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.ctl-label { font-size: var(--fs-cap); color: var(--ink-2); font-weight: 600; }

/* ------------------------------------------------------------------ shell */
.shell { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: calc(100vh - var(--top-h)); }
.sidenav {
  position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100vh - var(--top-h) - env(safe-area-inset-top, 0px)); overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface);
  padding-block: 18px 20px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  display: flex; flex-direction: column; gap: 18px;
}
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group-label { font-size: 12.5px; color: var(--ink-3); font-weight: 600; padding: 0 10px 4px; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 0; background: transparent; padding: 8px 10px; border-radius: 9px; cursor: pointer;
  font-size: 14.5px; font-weight: 600; color: var(--ink-2);
  transition: background-color .15s var(--ease), color .15s var(--ease);
}
.nav-item svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav-item[aria-current="page"] svg { opacity: 1; }
.nav-item .count { margin-left: auto; }
.nav-item .mini { margin-left: auto; display: inline-flex; }

/* status plate (desktop rail) */
.plate {
  border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface-3);
  padding: 14px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; text-align: left; width: 100%;
  transition: border-color .15s var(--ease), background-color .15s var(--ease);
}
.plate:hover { border-color: var(--line-strong); }
.plate-q { display: flex; align-items: center; gap: 10px; }
.plate-q b { font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.1; }
.plate-q small { display: block; font-size: 12.5px; color: var(--ink-2); line-height: 1.3; margin-top: 2px; }
.plate-figs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.plate-fig { display: flex; flex-direction: column; gap: 1px; }
.plate-fig span { font-size: 12px; color: var(--ink-2); }
.plate-fig b { font-family: var(--font-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.plate-fig b small { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--ink-2); }
.plate-cfg { font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 8px; }
.pulse { animation: pulse .9s var(--ease); }
@keyframes pulse { 0% { background-color: var(--accent-soft); } 100% { background-color: transparent; } }

/* ------------------------------------------------------------------ page */
.main { min-width: 0; padding-block: 26px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.page-head { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
.page-head .titles { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 360px; }
.page-head h1 { font-size: var(--fs-h1); }
.page-head .lede { color: var(--ink-2); font-size: var(--fs-lead); max-width: 66ch; }
.page-case { display: none; font-weight: 600; }
.page-head .controls { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; }
.subnav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 3px; background: var(--surface-2); border-radius: 11px; width: max-content; max-width: 100%; }
.subnav::-webkit-scrollbar { display: none; }
.subnav button { border: 0; background: transparent; padding: 7px 14px; min-height: 36px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.subnav button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(19, 40, 58, 0.14); }
.enter { animation: enter .26s var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 20px; min-width: 0; }
.panel > .p-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
.panel > .p-head h2 { font-size: var(--fs-h2); }
.panel > .p-head p { color: var(--ink-2); font-size: var(--fs-sm); margin-top: 4px; max-width: 70ch; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note {
  display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-m);
  background: var(--surface-2); color: var(--ink); font-size: var(--fs-sm); line-height: 1.5;
}
.note.accent { background: var(--accent-soft); }
.note.warn { background: var(--warn-soft); }
.note svg { flex: none; width: 20px; height: 20px; margin-top: 1px; }
.note b { font-weight: 600; }
.page-foot { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 18px; margin-top: 4px; }
.page-foot .scope { flex: 1 1 320px; font-size: var(--fs-cap); color: var(--ink-2); max-width: 72ch; }
.page-foot .scope button { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.page-foot .nexts { display: flex; gap: 8px; flex-wrap: wrap; }

/* ------------------------------------------------------------------ safety sign icons (ISO 3864 geometry) */
.sign { display: inline-flex; flex: none; width: 22px; height: 22px; }
.sign svg { width: 100%; height: 100%; display: block; }
.sign.lg { width: 44px; height: 44px; }
.sign.md { width: 30px; height: 30px; }
.sign.sm { width: 18px; height: 18px; }

/* ------------------------------------------------------------------ verdict and readouts */
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 18px; align-items: start; }
.verdict .q-name { font-family: var(--font-display); font-weight: 600; font-size: 34px; line-height: 1.05; }
.verdict .q-action { font-weight: 600; font-size: var(--fs-lead); margin-top: 4px; }
.verdict .q-text { color: var(--ink); max-width: 66ch; margin-top: 10px; }
.verdict .q-ctx { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.readout { display: flex; flex-direction: column; gap: 12px; }
.readout .r-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.readout .fig { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-fig); line-height: 1; letter-spacing: -0.01em; }
.readout .of { color: var(--ink-2); font-size: var(--fs-sm); }
.readout .eq { font-size: var(--fs-sm); color: var(--ink-2); }
.state-line { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14.5px; }
.budget { position: relative; height: 34px; margin-top: 14px; }
.budget .track { position: absolute; inset: 0; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.budget .seg-b { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; color: #FFFFFF; font-variant-numeric: tabular-nums; transition: left .5s var(--ease), width .5s var(--ease); white-space: nowrap; overflow: hidden; }
.budget .seg-b.s1 { background: var(--accent); }
.budget .seg-b.s2 { background: var(--accent-2); }
.budget .seg-b.s3 { background: var(--accent-3); color: var(--ink); }
.budget .over { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--crit-sig) 0 6px, var(--crit) 6px 12px); transition: left .5s var(--ease), width .5s var(--ease); }
.budget .limit { position: absolute; top: -8px; bottom: -8px; width: 0; border-left: 2px solid var(--ink); transition: left .5s var(--ease); }
.budget .limit span { position: absolute; top: -18px; left: 0; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--fs-sm); color: var(--ink-2); }
.legend li { list-style: none; display: inline-flex; align-items: center; gap: 7px; }
.legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.legend b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------ lists of findings */
.recs { display: flex; flex-direction: column; gap: 4px; list-style: none; }
.rec { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); }
.rec:first-child { border-top: 0; padding-top: 2px; }
.rec .t { font-weight: 600; }
.rec .d { color: var(--ink-2); font-size: var(--fs-sm); margin-top: 3px; }
.rec .s { color: var(--ink-3); font-size: var(--fs-cap); margin-top: 4px; }
.more { margin-top: 6px; }

/* ------------------------------------------------------------------ tables */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--r-m); border: 1px solid var(--line); }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface); }
table.data th, table.data td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data th { background: var(--surface-2); color: var(--ink-2); font-weight: 600; font-size: 13px; white-space: nowrap; }
table.data td.n, table.data th.n { text-align: right; white-space: nowrap; }
table.data tr:last-child td { border-bottom: 0; }
table.data tr.gov td { background: var(--accent-soft); }
table.data tr.sel td { background: var(--accent-soft); }
table.data tr.click { cursor: pointer; }
table.data tr.click:hover td { background: var(--surface-2); }
table.data .cell-state { display: inline-flex; align-items: center; gap: 6px; }

/* scenario tiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-m); padding: 14px 16px;
  cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0;
  transition: border-color .15s var(--ease), background-color .15s var(--ease), box-shadow .15s var(--ease);
}
.tile:hover { border-color: var(--line-strong); }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tile .k { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); }
.tile .v { font-family: var(--font-display); font-weight: 600; font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.1; }

    FSS_HANDRAIL_MAX_MM: 1800,// §2.2.1
    FSS_ALIGN_PERSONS: 90,    // §2.2.2

    FSS_ANGLE_MAX: 45,        // degrees, §2.2.3

  });

  /**

  var LIMITS = Object.freeze({
    zonePersons:   { min: 0,    max: 2000, int: true, unit: 'persons' },
    zoneArea:      { min: 1,    max: 5000, unit: 'm2', scope: 'rules' },
    zoneCrew:      { min: 0,    max: 2000, int: true, unit: 'persons', scope: 'rules' },
    target:        { min: 1,    max: 5000, int: true, unit: 'persons' },
    stairWidth:    { min: 0.60, max: 3.00, unit: 'm' },
    stairRise:     { min: 0.5,  max: 5.0,  unit: 'm' },
    stairAngle:    { min: 25,   max: 60,   unit: 'deg' },
    stairFlights:  { min: 1,    max: 12,   int: true, unit: 'count' },
    toMuster:      { min: 0,    max: 200,  unit: 'm' },
    exitWidth:     { min: 0.50, max: 20,   unit: 'm', scope: 'rules' },
    landing:       { min: 0.5,  max: 200,  unit: 'm2', scope: 'rules' },
    otherDeck:     { min: 0,    max: 2000, int: true, unit: 'persons', scope: 'rules' },
    doorWidth:     { min: 0.50, max: 10.0, unit: 'm' },
    corridorWidth: { min: 0.60, max: 10.0, unit: 'm' },
    openings:      { min: 1,    max: 10,   int: true, unit: 'count', scope: 'rules' },
    routeLength:   { min: 0.5,  max: 200,  unit: 'm' },
    EL:            { min: 1,    max: 30,   unit: 'min' },
    distance:      { min: 0.1,  max: 500,  unit: 'nm' },
    speed:         { min: 5,    max: 40,   warnAbove: 30, unit: 'kn', warn: 'speed_high' },
    prep:          { min: 0,    max: 120,  warnAbove: 25, unit: 'min', warn: 'prep_above_standard' },
    notif:         { min: 0,    max: 360,  unit: 'min' },
    certCapacity:  { min: 1,    max: 5000, int: true, unit: 'persons' },
    shipLength:    { min: 10,   max: 400,  unit: 'm' },
    musterArea:    { min: 0,    max: 5000, unit: 'm2' },
    wiLoad:        { min: 0,    max: 100,  int: true, unit: 'pct' },
    wiNotif:       { min: 0,    max: 240,  unit: 'min' },
    wiSpeed:       { min: 0,    max: 60,   int: true, unit: 'pct' }
  });

  var CAPS = Object.freeze({ configs: 6, zones: 30, stairs: 12, elements: 40, routes: 200, otherDecks: 3 });
  var RESCUE_KEYS = ['opt', 'base', 'pess'];
  var AREAS = ['engine', 'cardeck', 'accom', 'other'];
  var DECL = ['yes', 'no'];
  var STATUS_ORDER = { fail: 4, confirm: 3, data: 2, pass: 1, na: 0 };

  // ---------------------------------------------------------------- helpers
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function isBlank(v) { return v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v)); }
  function sum(arr) { var s = 0; for (var i = 0; i < arr.length; i++) { s += arr[i]; } return s; }
  function deg2rad(d) { return d * Math.PI / 180; }
  function popcount(x) { var c = 0; while (x) { x &= x - 1; c++; } return c; }
  function byId(list) { var m = {}; (list || []).forEach(function (o) { m[o.id] = o; }); return m; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function uniq(list) { return list.filter(function (v, i, arr) { return arr.indexOf(v) === i; }); }
  function worst(statuses) {

    return w;
  }
  function stairDir(s) {

      ? { fs: C.FS_STAIR_DOWN, speed: C.S_STAIR_DOWN }

  function inclinedLength(s) { return s.flights * s.rise / Math.sin(deg2rad(s.angle)); }

    return 'compound_critical';
  }
  /** Largest ideal travel duration tI (s) that still meets the limit n at night for a given gamma. */
  function allowedTI(gamma, EL) {

  function nightOf(T, EL) { return C.SAFETY * (C.R_NIGHT + T) + (2 / 3) * EL; }

  // ------------------------------------------------------------ normalise

  }

  }

  /**
   * Bring any FIRE-MAR assessment (schema 1 or 2, or a partial object) to the complete schema-2 shape.

   */
  function normalize(src) {

    var m = a.meta || {}, d = m.decl || {}, r = a.route || {}, sc = r.sc || {};
    var w = a.whatif || {}, o = a.options || {}, as = a.assessor || {};
    var out = {
      schema: SCHEMA,
      meta: {
        vessel: str(m.vessel), shipLength: numOrNull(m.shipLength), certCapacity: numOrNull(m.certCapacity),
        musterArea: numOrNull(m.musterArea), isExample: !!m.isExample,
        shipStatus: m.shipStatus === 'new' ? 'new' : 'existing',
        decl: {
          belowBulkhead: declOf(d.belowBulkhead), wtIndependent: declOf(d.wtIndependent),
          lll: declOf(d.lll), noKeys: declOf(d.noKeys), quickRelease: declOf(d.quickRelease)

      },
      route: { name: str(r.name), sarBase: str(r.sarBase), distance: numOrNull(r.distance), sc: {}, ref: oneOf(r.ref, RESCUE_KEYS, 'base') },
      time: { EL: a.time && a.time.EL !== undefined ? numOrNull(a.time.EL) : 30 },
      load: { target: numOrNull(a.load && a.load.target) },
      options: { fssBasis: o.fssBasis === 'A' ? 'A' : 'B' },
      configs: [],
      active: str(a.active),
      whatif: {

        loadPct: isNum(w.loadPct) ? w.loadPct : 0,
        rescue: oneOf(w.rescue, ['ref'].concat(RESCUE_KEYS), 'ref'),
        notifAdd: isNum(w.notifAdd) ? w.notifAdd : 0,
        speedPct: isNum(w.speedPct) ? w.speedPct : 0,
        include: !!w.include

      assessor: { name: str(as.name), org: str(as.org), date: str(as.date), source: str(as.source), measured: !!as.measured },

    RESCUE_KEYS.forEach(function (k) {
      var p = sc[k] || {};
      out.route.sc[k] = { notif: numOrNull(p.notif), prep: numOrNull(p.prep), speed: numOrNull(p.speed) };
    });
    Object.keys(a.reasons || {}).forEach(function (k) { if (typeof a.reasons[k] === 'string') { out.reasons[k] = a.reasons[k]; } });
    out.configs = (Array.isArray(a.configs) ? a.configs : []).map(function (c) {
      return {
        id: str(c.id), name: str(c.name), note: str(c.note),
        zones: (c.zones || []).map(function (z) {
          return { id: str(z.id), name: str(z.name), persons: numOrNull(z.persons), area: numOrNull(z.area), crew: numOrNull(z.crew) };
        }),
        stairs: (c.stairs || []).map(function (s) {
          return {
            id: str(s.id), name: str(s.name), width: numOrNull(s.width), dir: s.dir === 'down' ? 'down' : 'up',
            rise: numOrNull(s.rise), angle: numOrNull(s.angle), flights: numOrNull(s.flights), toMuster: numOrNull(s.toMuster),
            exitWidth: numOrNull(s.exitWidth), landing: numOrNull(s.landing), landingPublic: declOf(s.landingPublic),
            handrails: declOf(s.handrails), orient: oneOf(s.orient, ['fa', 'ath'], null), enclosed: declOf(s.enclosed),
            otherDecks: Array.isArray(s.otherDecks) ? s.otherDecks.map(numOrNull).filter(function (v) { return v !== null; }) : [],
            area: oneOf(s.area, AREAS, '')
          };

        elements: (c.elements || []).map(function (e) {

  // ------------------------------------------------------------- validation
  /**
   * @param {any} a assessment (schema 2)
   * @returns {Array<{level:string, code:string, path:string, cfg:string|null, scope:string, params:any}>}

  function validate(a) {
    var issues = [];
    function add(level, code, path, cfg, params, scope) {

    }
    function checkNum(value, key, path, cfg, required) {
      var L = LIMITS[key];

        if (required) { add('error', 'required', path, cfg, { key: key }, scope); }

      }
      if (!isNum(value)) { add('error', 'not_a_number', path, cfg, { key: key }, scope); return false; }
      if (L.int && Math.abs(value - Math.round(value)) > EPS) { add('error', 'not_integer', path, cfg, { key: key }, scope); return false; }
      if (value < L.min - EPS || value > L.max + EPS) {

        return false;

    }

      if (typeof value !== 'string' || value.trim() === '') { add('error', 'name_required', path, cfg, {}); return false; }
      return true;
    }
    function checkChoice(value, list, path, cfg, scope) {
      if (value !== null && value !== undefined && value !== '' && list.indexOf(value) < 0) { add('error', 'bad_choice', path, cfg, {}, scope); }
    }

    if (!a || typeof a !== 'object') { add('error', 'no_data', '', null, {}); return issues; }
    var meta = a.meta || {};
    var route = a.route || {};
    var time = a.time || {};
    var load = a.load || {};

    checkNum(meta.shipLength, 'shipLength', 'meta.shipLength', null, false);
    checkNum(meta.certCapacity, 'certCapacity', 'meta.certCapacity', null, false);
    checkNum(meta.musterArea, 'musterArea', 'meta.musterArea', null, false);
    checkNum(time.EL, 'EL', 'time.EL', null, true);
    checkNum(load.target, 'target', 'load.target', null, false);
    checkChoice(meta.shipStatus, ['existing', 'new'], 'meta.shipStatus', null, 'main');
    var dcl = meta.decl || {};

    checkNum(wi.loadPct, 'wiLoad', 'whatif.loadPct', null, false);
    checkNum(wi.notifAdd, 'wiNotif', 'whatif.notifAdd', null, false);
    checkNum(wi.speedPct, 'wiSpeed', 'whatif.speedPct', null, false);

    var configs = Array.isArray(a.configs) ? a.configs : [];
    if (configs.length === 0) { add('error', 'no_config', 'configs', null, {}); }
    if (configs.length > CAPS.configs) { add('error', 'too_many', 'configs', null, { what: 'configs', max: CAPS.configs }); }
    var cfgIds = {};
    var totals = [];

    configs.forEach(function (cfg) {
      var cid = cfg.id;
      var base = 'cfg.' + cid;
      if (!cid || cfgIds[cid]) { add('error', 'bad_id', base, cid, {}); }
      cfgIds[cid] = true;
      checkName(cfg.name, base + '.name', cid);

      var zones = Array.isArray(cfg.zones) ? cfg.zones : [];
      var stairs = Array.isArray(cfg.stairs) ? cfg.stairs : [];
      var elements = Array.isArray(cfg.elements) ? cfg.elements : [];
      var routes = Array.isArray(cfg.routes) ? cfg.routes : [];
      if (zones.length === 0) { add('error', 'no_zone', base + '.zones', cid, {}); }
      if (stairs.length === 0) { add('error', 'no_stair', base + '.stairs', cid, {}); }
      if (zones.length > CAPS.zones) { add('error', 'too_many', base + '.zones', cid, { what: 'zones', max: CAPS.zones }); }
      if (stairs.length > CAPS.stairs) { add('error', 'too_many', base + '.stairs', cid, { what: 'stairs', max: CAPS.stairs }); }
      if (elements.length > CAPS.elements) { add('error', 'too_many', base + '.elements', cid, { what: 'elements', max: CAPS.elements }); }
      if (routes.length > CAPS.routes) { add('error', 'too_many', base + '.routes', cid, { what: 'routes', max: CAPS.routes }); }

        list.forEach(function (o) {

      }
      function uniqueIds(list, kind) {
        var seen = {};
        list.forEach(function (o) {

      var definedTotal = 0;

      zones.forEach(function (z) {

      stairs.forEach(function (s) {

        checkName(s.name, p + '.name', cid);

        if (s.dir !== 'up' && s.dir !== 'down') { add('error', 'bad_choice', p + '.dir', cid, {}); }
        checkNum(s.rise, 'stairRise', p + '.rise', cid, true);
        checkNum(s.angle, 'stairAngle', p + '.angle', cid, true);
        checkNum(s.flights, 'stairFlights', p + '.flights', cid, true);
        checkNum(s.toMuster, 'toMuster', p + '.toMuster', cid, true);
        checkNum(s.exitWidth, 'exitWidth', p + '.exitWidth', cid, false);
        checkNum(s.landing, 'landing', p + '.landing', cid, false);
        checkChoice(s.landingPublic, DECL, p + '.landingPublic', cid, 'rules');
        checkChoice(s.handrails, DECL, p + '.handrails', cid, 'rules');
        checkChoice(s.enclosed, DECL, p + '.enclosed', cid, 'rules');
        checkChoice(s.orient, ['fa', 'ath'], p + '.orient', cid, 'rules');
        checkChoice(s.area, AREAS, p + '.area', cid, 'rules');

        if (od !== undefined && od !== null) {

            if (bad.length) { add('error', 'bad_list', p + '.otherDecks', cid, { max: LIMITS.otherDeck.max }, 'rules'); }
          }
        }
      });

      elements.forEach(function (e) {
        var p = base + '.elements.' + e.id;
        checkName(e.name, p + '.name', cid);
        if (e.kind === 'door') { checkNum(e.width, 'doorWidth', p + '.width', cid, true); }
        else if (e.kind === 'corridor') { checkNum(e.width, 'corridorWidth', p + '.width', cid, true); }
        else { add('error', 'bad_choice', p + '.kind', cid, {}); }
        checkNum(e.openings, 'openings', p + '.openings', cid, false);
        checkChoice(e.area, AREAS, p + '.area', cid, 'rules');
      });
      uniqueNames(elements, 'elements');

      var zMap = byId(zones), sMap = byId(stairs), eMap = byId(elements);
      var pairSeen = {};
      var usedStairs = {};
      var primaryOf = {};
      routes.forEach(function (r) {
        var p = base + '.routes.' + r.id;
        if (!zMap[r.zone]) { add('error', 'bad_ref_zone', p + '.zone', cid, {}); }
        if (!sMap[r.stair]) { add('error', 'bad_ref_stair', p + '.stair', cid, {}); }
        var lenOk = checkNum(r.length, 'routeLength', p + '.length', cid, true);
        if (lenOk && isNum(meta.shipLength) && meta.shipLength >= LIMITS.shipLength.min && r.length > meta.shipLength + EPS) {

        }
        if (r.door) {
          if (!eMap[r.door]) { add('error', 'bad_ref_element', p + '.door', cid, {}); }
          else if (eMap[r.door].kind !== 'door') { add('error', 'wrong_element_kind', p + '.door', cid, { expected: 'door' }); }
        }
        if (r.corridor) {
          if (!eMap[r.corridor]) { add('error', 'bad_ref_element', p + '.corridor', cid, {}); }

        }
        if (r.kind !== 'primary' && r.kind !== 'backup') { add('error', 'bad_choice', p + '.kind', cid, {}); }
        var key = r.zone + '>' + r.stair;
        if (pairSeen[key]) { add('error', 'duplicate_route', p + '.stair', cid, {}); }
        pairSeen[key] = true;
        if (sMap[r.stair]) { usedStairs[r.stair] = true; }
        if (r.kind === 'primary' && sMap[r.stair]) { primaryOf[r.zone] = true; }
      });
      zones.forEach(function (z) {
        if (zoneOk[z.id] && z.persons > 0 && !primaryOf[z.id]) {
          add('error', 'zone_no_primary', base + '.zones.' + z.id + '.persons', cid, { zone: z.name });
        }
      });
      stairs.forEach(function (s) {
        if (!usedStairs[s.id]) { add('warning', 'stair_unused', base + '.stairs.' + s.id + '.name', cid, { stair: s.name }); }
      });
    });

    var activeCfg = configs.filter(function (c) { return c.id === a.active; })[0] || configs[0];
    var activeTotal = null;
    totals.forEach(function (t) { if (activeCfg && t.cfg === activeCfg.id && t.complete) { activeTotal = t.total; } });
    var current = isNum(load.target) ? load.target : activeTotal;
    if (isNum(current) && isNum(meta.certCapacity) && current > meta.certCapacity + EPS) {
      add('warning', 'capacity_exceeded', isNum(load.target) ? 'load.target' : 'meta.certCapacity', null,
        { value: current, limit: meta.certCapacity, unit: 'persons' });
    }
    if (!isNum(load.target)) {
      var complete = totals.filter(function (t) { return t.complete; });
      var differ = complete.some(function (t) { return Math.abs(t.total - complete[0].total) > EPS; });
      if (differ) { add('warning', 'totals_differ', 'configs', null, { totals: complete }); }
    }
    if (!activeCfg) { add('error', 'no_config', 'active', null, {}); }
    else if (a.active !== activeCfg.id) { add('error', 'bad_reference', 'active', null, {}); }
    return issues;
  }

  // ------------------------------------------------------------ allocation
  /**
   * Lexicographically balanced allocation of persons to stairways (crew-directed loading).
   * Stairs with the highest forced average load form the first block (densest subset of the
   * zone–stair graph); the procedure repeats on the remaining stairs. Within a block every
   * stairway carries the same number of persons. Exact, combinatorial, deterministic.
   * @param {Array<string>} stairIds active stairs, fixed order
   * @param {Array<{id:string, n:number, stairs:Array<string>}>} demand zones with persons > 0
   */
  function balance(stairIds, demand) {
    var k = stairIds.length;
    var idx = {};
    stairIds.forEach(function (s, i) { idx[s] = i; });
    var full = (1 << k) - 1;
    var zoneMask = demand.map(function (z) {
      var m = 0;
      z.stairs.forEach(function (s) { if (idx[s] !== undefined) { m |= (1 << idx[s]); } });
      return m;
    });
    var load = {}, blockOfStair = {}, blockOfZone = {};
    var blocks = [];
    var R = full;
    var left = demand.map(function (_, i) { return i; });
    var size = 1 << k;
    while (left.length) {
      var f = new Float64Array(size);
      left.forEach(function (i) { f[zoneMask[i] & R] += demand[i].n; });
      // subset sums: g[T] = sum of f[M] for all M subset of T
      for (var b = 0; b < k; b++) {
        var bit = 1 << b;
        for (var m = 0; m < size; m++) { if (m & bit) { f[m] += f[m ^ bit]; } }
      }
      var best = 0, bestD = -1, bestPop = 0;
      for (var T = R; T > 0; T = (T - 1) & R) {
        var pc = popcount(T);
        var d = f[T] / pc;
        var tol = 1e-12 * Math.max(1, Math.abs(d));
        if (d > bestD + tol || (Math.abs(d - bestD) <= tol && (pc > bestPop || (pc === bestPop && T < best)))) {
          best = T; bestD = d; bestPop = pc;
        }
      }
      var block = { index: blocks.length, stairs: [], zones: [], load: bestD };
      for (var j = 0; j < k; j++) {
        if (best & (1 << j)) { block.stairs.push(stairIds[j]); load[stairIds[j]] = bestD; blockOfStair[stairIds[j]] = block.index; }
      }
      var still = [];
      left.forEach(function (i) {
        if ((zoneMask[i] & R & ~best) === 0) { block.zones.push(demand[i].id); blockOfZone[demand[i].id] = block.index; }
        else { still.push(i); }
      });
      blocks.push(block);
      R &= ~best;
      left = still;
      if (block.zones.length === 0) { break; } // cannot happen for valid input; guards an endless loop
    }
    stairIds.forEach(function (s) { if (load[s] === undefined) { load[s] = 0; blockOfStair[s] = -1; } });
    return { load: load, blockOfStair: blockOfStair, blockOfZone: blockOfZone, blocks: blocks };
  }

  // ------------------------------------------------------------ evaluation
  function makeCtx(cfg, a, targetOverride) {
    var definedTotal = sum(cfg.zones.map(function (z) { return z.persons; }));
    var target = isNum(targetOverride) ? targetOverride : (isNum(a.load && a.load.target) ? a.load.target : null);
    var scale = target ? target / definedTotal : 1;
    var zoneN = {};
    cfg.zones.forEach(function (z) { zoneN[z.id] = z.persons * scale; });
    return {
      cfg: cfg, EL: a.time.EL, scale: scale, definedTotal: definedTotal,
      total: target || definedTotal, zoneN: zoneN,
      zones: byId(cfg.zones), stairs: byId(cfg.stairs), elements: byId(cfg.elements)
    };
  }

  /** Routes each zone may use when stair `removed` cannot be used (null = all stairs available). */
  function availability(ctx, removed) {
    var out = {};
    ctx.cfg.zones.forEach(function (z) {
      if (!(ctx.zoneN[z.id] > 0)) { return; }
      var mine = ctx.cfg.routes.filter(function (r) { return r.zone === z.id && r.stair !== removed; });
      var prim = mine.filter(function (r) { return r.kind === 'primary'; });
      out[z.id] = prim.length ? { routes: prim, backup: false } : { routes: mine.filter(function (r) { return r.kind === 'backup'; }), backup: true };
    });
    return out;
  }

  /** Flow statistics of one stairway carrying n persons that arrive by the given routes. */
  function stairStats(ctx, stairId, n, users) {
    var s = ctx.stairs[stairId];
    var dir = stairDir(s);
    var comps = [{ kind: 'stair', id: s.id, width: s.width, fs: dir.fs, cap: dir.fs * s.width }];
    var seen = {}; seen[s.id] = true;
    users.forEach(function (r) {
      [['door', r.door, C.FS_DOOR], ['corridor', r.corridor, C.FS_CORRIDOR]].forEach(function (t) {
        if (t[1] && !seen[t[1]]) {
          var e = ctx.elements[t[1]];
          seen[t[1]] = true;
          comps.push({ kind: t[0], id: e.id, width: e.width, fs: t[2], cap: t[2] * e.width });
        }
      });
    });
    var bottleneck = comps[0];
    comps.forEach(function (c) { if (c.cap < bottleneck.cap - EPS) { bottleneck = c; } });
    var far = users[0];
    users.forEach(function (r) { if (r.length > far.length + EPS) { far = r; } });
    // Inlet: calculated flow of the largest approach route (narrowest element of that route), as in the paper.
    var inlet = null;
    users.forEach(function (r) {
      var caps = [];
      if (r.door) { caps.push(C.FS_DOOR * ctx.elements[r.door].width); }
      if (r.corridor) { caps.push(C.FS_CORRIDOR * ctx.elements[r.corridor].width); }
      if (caps.length) { var v = Math.min.apply(null, caps); if (inlet === null || v > inlet) { inlet = v; } }
    });
    var outlet = dir.fs * s.width;
    var Lst = inclinedLength(s);
    var tF = n / bottleneck.cap;
    var tDeck = far.length / C.S_CORRIDOR;
    var tStair = Lst / dir.speed;
    var tAsm = s.toMuster / C.S_CORRIDOR;
    return {
      stair: s.id, n: n, fc: bottleneck.cap, bottleneck: { kind: bottleneck.kind, id: bottleneck.id },
      components: comps, users: users.map(function (r) { return r.id; }),
      zones: uniq(users.map(function (r) { return r.zone; })),
      farRoute: far.id, lDeck: far.length, lStair: Lst, lAsm: s.toMuster,
      tF: tF, tDeck: tDeck, tStair: tStair, tAsm: tAsm, tI: tF + tDeck + tStair + tAsm,
      travel: tDeck + tStair + tAsm,
      inlet: inlet, outlet: outlet, congestion: inlet === null ? null : inlet - outlet
    };
  }

  function finishScenario(ctx, rows, gamma, extra) {
    var gov = null;
    rows.forEach(function (r) { if (!gov || r.tI > gov.tI + EPS) { gov = r; } });
    var tImax = gov ? gov.tI : 0;
    var T = (gamma + C.DELTA) * tImax / 60;
    var out = {
      gamma: gamma, rows: rows, govStair: gov ? gov.stair : null, tImax: tImax, T: T,
      night: nightOf(T, ctx.EL), day: dayOf(T, ctx.EL)
    };
    if (extra) { Object.keys(extra).forEach(function (k) { out[k] = extra[k]; }); }
    return out;
  }

  /** Crew-directed loading (Scenario A and every secondary case). */
  function balancedScenario(ctx, removed, gamma) {
    var avail = availability(ctx, removed);
    var stairIds = ctx.cfg.stairs.map(function (s) { return s.id; }).filter(function (s) { return s !== removed; });
    var disconnected = [];
    var demand = [];
    Object.keys(avail).forEach(function (zid) {
      var list = avail[zid].routes;
      if (!list.length) { disconnected.push(zid); return; }
      demand.push({ id: zid, n: ctx.zoneN[zid], stairs: list.map(function (r) { return r.stair; }) });
    });
    if (disconnected.length) {
      return { failed: true, removed: removed, disconnected: disconnected, gamma: gamma, rows: [] };
    }
    demand.sort(function (x, y) { return ctx.cfg.zones.indexOf(ctx.zones[x.id]) - ctx.cfg.zones.indexOf(ctx.zones[y.id]); });
    var bal = balance(stairIds, demand);
    var rows = [];
    stairIds.forEach(function (sid) {
      var n = bal.load[sid];
      if (!(n > EPS)) { return; }
      var blk = bal.blockOfStair[sid];
      var users = [];
      demand.forEach(function (z) {
        if (bal.blockOfZone[z.id] !== blk) { return; }
        avail[z.id].routes.forEach(function (r) { if (r.stair === sid) { users.push(r); } });
      });
      rows.push(stairStats(ctx, sid, n, users));
    });
    var usesBackup = Object.keys(avail).filter(function (z) { return avail[z].backup; });
    return finishScenario(ctx, rows, gamma, { failed: false, removed: removed, disconnected: [], usesBackup: usesBackup, blocks: bal.blocks });
  }

  /** Every person walks to the nearest stairway (shortest primary route; ties split equally). */
  function nearestScenario(ctx, gamma) {
    var load = {}, users = {};
    ctx.cfg.stairs.forEach(function (s) { load[s.id] = 0; users[s.id] = []; });
    var choice = {};
    ctx.cfg.zones.forEach(function (z) {
      var n = ctx.zoneN[z.id];
      if (!(n > 0)) { return; }
      var prim = ctx.cfg.routes.filter(function (r) { return r.zone === z.id && r.kind === 'primary'; });
      var min = Math.min.apply(null, prim.map(function (r) { return r.length; }));
      var near = prim.filter(function (r) { return r.length <= min + 1e-9; });
      choice[z.id] = near.map(function (r) { return r.stair; });
      near.forEach(function (r) { load[r.stair] += n / near.length; users[r.stair].push(r); });
    });
    var rows = [];
    ctx.cfg.stairs.forEach(function (s) {
      if (load[s.id] > EPS) { rows.push(stairStats(ctx, s.id, load[s.id], users[s.id])); }
    });
    return finishScenario(ctx, rows, gamma || C.GAMMA_PRIMARY, { failed: false, choice: choice });
  }

  /**
   * Secondary cases: each stairway in turn cannot be used; the worst case governs. This includes
   * Circ.1533 Annex 1 §4.1.2 alternative 1 (the stairway of largest capacity unavailable).
   * Equal results are resolved in favour of losing the stairway with the largest capacity,
   * then the one that carries most persons in Scenario B.
   */
  function secondaryScenario(ctx, bLoads) {
    var cases = ctx.cfg.stairs.map(function (s) { return balancedScenario(ctx, s.id, C.GAMMA_SECONDARY); });
    var failedCases = cases.filter(function (c) { return c.failed; });
    function capOf(id) { var s = ctx.stairs[id]; return stairDir(s).fs * s.width; }
    var gov = null;
    cases.forEach(function (c) {
      if (c.failed) { return; }
      if (!gov || c.tImax > gov.tImax + 1e-6) { gov = c; return; }
      if (Math.abs(c.tImax - gov.tImax) <= 1e-6) {
        var dc = capOf(c.removed) - capOf(gov.removed);
        var db = (bLoads[c.removed] || 0) - (bLoads[gov.removed] || 0);
        if (dc > EPS || (Math.abs(dc) <= EPS && db > EPS)) { gov = c; }
      }
    });
    var out = gov ? clone(gov) : { gamma: C.GAMMA_SECONDARY, rows: [], tImax: 0, T: 0, night: null, day: null };
    out.cases = cases.map(function (c) {
      return { removed: c.removed, failed: c.failed, disconnected: c.disconnected, tImax: c.failed ? null : c.tImax, night: c.failed ? null : c.night };
    });
    out.governingRemoved = gov ? gov.removed : null;
    out.failed = failedCases.length > 0;
    out.failedCases = failedCases.map(function (c) { return { removed: c.removed, disconnected: c.disconnected }; });
    out.allCases = cases;
    return out;
  }

  /** Maximum persons (same distribution) that keeps every scenario within the limit n. */
  function capacityAnalysis(ctx, scen) {
    var kMin = Infinity, limiting = null, impossible = [];
    var req = {};
    var tooLong = [];
    var list = [['A', scen.A, C.GAMMA_PRIMARY], ['B', scen.B, C.GAMMA_PRIMARY]];
    scen.S.allCases.forEach(function (c) { if (!c.failed) { list.push(['S', c, C.GAMMA_SECONDARY]); } });
    list.forEach(function (it) {
      var sc = it[1];
      var allowed = allowedTI(it[2], ctx.EL);
      sc.rows.forEach(function (r) {
        var room = allowed - r.travel;
        var k = room > 0 ? room * r.fc / r.n : 0;
        if (room <= 0) { impossible.push({ scenario: it[0], removed: sc.removed || null, stair: r.stair }); }
        if (k < kMin - EPS) { kMin = k; limiting = { scenario: it[0], removed: sc.removed || null, stair: r.stair }; }
        if (r.tI > allowed + EPS) {
          if (room <= 0) {
            tooLong.push({ scenario: it[0], removed: sc.removed || null, stair: r.stair, travel: r.travel, allowed: allowed });
          } else {
            var fcReq = r.n / room;
            r.components.forEach(function (comp) {
              if (comp.cap < fcReq - EPS) {
                var w = fcReq / comp.fs;
                if (!req[comp.id] || w > req[comp.id].required) {
                  req[comp.id] = { id: comp.id, kind: comp.kind, current: comp.width, required: w, scenario: it[0], removed: sc.removed || null, stair: r.stair };
                }
              }
            });
          }
        }
      });
    });
    var reqList = Object.keys(req).map(function (k) { return req[k]; });
    var order = {};
    ctx.cfg.stairs.forEach(function (s, i) { order[s.id] = i; });
    ctx.cfg.elements.forEach(function (e, i) { order[e.id] = 100 + i; });
    reqList.sort(function (x, y) { return order[x.id] - order[y.id]; });
    return {
      maxPersons: isFinite(kMin) ? kMin * ctx.total : null,
      factor: isFinite(kMin) ? kMin : null,
      limiting: limiting, impossible: impossible,
      requirements: reqList, tooLong: tooLong,
      allowedPrimary: allowedTI(C.GAMMA_PRIMARY, ctx.EL), allowedSecondary: allowedTI(C.GAMMA_SECONDARY, ctx.EL)
    };
  }

  function computeConfig(cfg, a, targetOverride) {
    var ctx = makeCtx(cfg, a, targetOverride);
    var A = balancedScenario(ctx, null, C.GAMMA_PRIMARY);
    var B = nearestScenario(ctx, C.GAMMA_PRIMARY);
    var bLoads = {};
    B.rows.forEach(function (r) { bLoads[r.stair] = r.n; });
    var S = secondaryScenario(ctx, bLoads);
    var scen = { A: A, B: B, S: S };
    var govKey = 'A';
    ['B', 'S'].forEach(function (k) { if (scen[k].night !== null && scen[k].night > scen[govKey].night + EPS) { govKey = k; } });
    var governing = { scenario: govKey, night: scen[govKey].night, day: scen[govKey].day };
    var vesselMet = !S.failed && governing.night <= C.N_LIMIT + EPS;
    var cap = capacityAnalysis(ctx, scen);
    var congestion = [];
    [['A', A], ['B', B], ['S', S]].forEach(function (it) {
      (it[1].rows || []).forEach(function (r) {
        if (r.congestion !== null && r.congestion > C.CONGESTION_DELTA + EPS) {
          congestion.push({ scenario: it[0], stair: r.stair, delta: r.congestion, inlet: r.inlet, outlet: r.outlet });
        }
      });
    });
    // Appendix 1 §2.2.13.1: spaces with an initial density of 3.5 p/m² or more.
    var density = [], missingArea = [];
    cfg.zones.forEach(function (z) {
      var n = ctx.zoneN[z.id];
      if (!(n > 0)) { return; }
      if (!isNum(z.area) || z.area < LIMITS.zoneArea.min) { missingArea.push(z.id); return; }
      var dd = n / z.area;
      density.push({ zone: z.id, density: dd, persons: n, area: z.area, congested: dd >= C.CONGESTION_DENSITY - EPS });
    });
    return {
      id: cfg.id, ok: true, total: ctx.total, definedTotal: ctx.definedTotal, scale: ctx.scale,
      scenarios: scen, governing: governing, vesselMet: vesselMet, margin: C.N_LIMIT - governing.night,
      fixedPart: C.SAFETY * C.R_NIGHT + (2 / 3) * ctx.EL,
      capacity: cap, congestion: congestion,
      density: density, missingArea: missingArea,
      crewValue: B.night - A.night
    };
  }

  function rescueOf(distance, p, notifAdd, speedPct) {
    var notif = p.notif + (notifAdd || 0);
    var speed = p.speed * (1 - (speedPct || 0) / 100);
    var travel = 60 * distance / speed;
    var total = notif + p.prep + travel;
    return {
      notif: notif, prep: p.prep, speed: speed, travel: travel, total: total,
      margin: C.SAR_LIMIT - total, met: total <= C.SAR_LIMIT + EPS,
      critNotif: C.SAR_LIMIT - p.prep - travel,
      prepAbove: p.prep > C.SAR_RESPONSE_MAX + EPS, travelAbove: travel > C.SAR_TRAVEL_MAX + EPS
    };
  }
  function computeRescue(route) {
    var out = { distance: route.distance, ref: route.ref, sc: {} };
    RESCUE_KEYS.forEach(function (k) { out.sc[k] = rescueOf(route.distance, route.sc[k], 0, 0); });
    return out;
  }

  // ------------------------------------------------------------ rule checks
  /** Persons each stairway and each approach element must be sized for (FSS 13.2.1.1, 2.1.2.2.1, 2.3.1). */
  function designLoads(cfg, cfgRes, basis) {
    var scale = cfgRes.scale;
    var eff = {};
    cfg.zones.forEach(function (z) {
      var p = (z.persons || 0) * scale;
      var crew = isNum(z.crew) ? Math.min(z.crew, z.persons || 0) * scale : 0;
      eff[z.id] = p - crew + C.FSS_CREW_FACTOR * crew;
    });
    var stairN = {}, elemN = {};
    cfg.stairs.forEach(function (s) { stairN[s.id] = 0; elemN[s.id] = {}; });
    function addElem(sid, eid, n) { if (eid) { elemN[sid][eid] = (elemN[sid][eid] || 0) + n; } }
    if (basis === 'A') {
      var demand = [], prim = {};
      cfg.zones.forEach(function (z) {
        if (!(eff[z.id] > 0)) { return; }
        prim[z.id] = cfg.routes.filter(function (r) { return r.zone === z.id && r.kind === 'primary'; });
        demand.push({ id: z.id, n: eff[z.id], stairs: prim[z.id].map(function (r) { return r.stair; }) });
      });
      var bal = balance(cfg.stairs.map(function (s) { return s.id; }), demand);
      cfg.stairs.forEach(function (s) {
        var L = bal.load[s.id] || 0;
        stairN[s.id] = L;
        if (!(L > EPS)) { return; }
        var blk = bal.blockOfStair[s.id];
        demand.forEach(function (z) {
          if (bal.blockOfZone[z.id] !== blk) { return; }
          prim[z.id].forEach(function (r) {
            if (r.stair !== s.id) { return; }
            // conservative: every approach element of the block may carry the whole stair load
            if (r.door) { elemN[s.id][r.door] = L; }
            if (r.corridor) { elemN[s.id][r.corridor] = L; }
          });
        });
      });
    } else {
      cfg.zones.forEach(function (z) {
        var n = eff[z.id];
        if (!(n > 0)) { return; }
        var pr = cfg.routes.filter(function (r) { return r.zone === z.id && r.kind === 'primary'; });
        if (!pr.length) { return; }
        var min = Math.min.apply(null, pr.map(function (r) { return r.length; }));
        var near = pr.filter(function (r) { return r.length <= min + 1e-9; });
        near.forEach(function (r) {
          var share = n / near.length;
          stairN[r.stair] += share;
          addElem(r.stair, r.door, share);
          addElem(r.stair, r.corridor, share);
        });
      });
    }
    return { eff: eff, stairN: stairN, elemN: elemN };
  }

  function check(id, group, clause, kind, items, status) {
    return { id: id, group: group, clause: clause, kind: kind, items: items, status: status !== undefined ? status : worst(items.map(function (i) { return i.status; })) };
  }
  function declStatus(v) { return v === 'yes' ? 'pass' : (v === 'no' ? 'fail' : 'data'); }

  /**
   * Means-of-escape rule checks for one computed configuration.
   * Status per item: pass | fail | confirm (needs a competent person's judgement) | data (input missing) | na.
   */
  function rulesFor(a, cfg, cfgRes, issues) {
    var basis = a.options && a.options.fssBasis === 'A' ? 'A' : 'B';
    var L = designLoads(cfg, cfgRes, basis);
    var eMap = byId(cfg.elements);
    var bad = {};
    (issues || []).forEach(function (i) { if (i.level === 'error' && i.cfg === cfg.id) { bad[i.path] = true; } });
    function invalid(path) { return !!bad[path]; }
    var checks = [];
    var sized = {};

    // ---- MSC.1/Circ.1533 performance standard and congestion (SOLAS II-2/13.3.2.7)
    checks.push(check('circ_performance', 'evac', 'MSC.1/Circ.1533 Annex 1 §5.1–5.2; SOLAS II-2/13.3.2.7', 'calc', [{
      subject: { type: 'ship' }, status: cfgRes.vesselMet ? 'pass' : 'fail',
      value: cfgRes.governing.night, limit: C.N_LIMIT, scenario: cfgRes.governing.scenario, secondaryFailed: cfgRes.scenarios.S.failed
    }]));
    var congItems = [];
    var maxDelta = null;
    ['A', 'B', 'S'].forEach(function (k) {
      (cfgRes.scenarios[k].rows || []).forEach(function (r) { if (r.congestion !== null && (maxDelta === null || r.congestion > maxDelta)) { maxDelta = r.congestion; } });
    });
    congItems.push({ subject: { type: 'flow' }, status: cfgRes.congestion.length ? 'confirm' : (maxDelta === null ? 'na' : 'pass'), points: cfgRes.congestion, maxDelta: maxDelta, limit: C.CONGESTION_DELTA });
    var dens = cfgRes.density.filter(function (d) { return d.congested; });
    var maxDens = null;
    cfgRes.density.forEach(function (d) { if (maxDens === null || d.density > maxDens.density) { maxDens = d; } });
    congItems.push({
      subject: { type: 'density' }, status: dens.length ? 'confirm' : (cfgRes.missingArea.length ? 'data' : 'pass'),
      points: dens, missing: cfgRes.missingArea, max: maxDens, limit: C.CONGESTION_DENSITY
    });
    checks.push(check('circ_congestion', 'evac', 'MSC.1/Circ.1533 Appendix 1 §2.2.13; SOLAS II-2/13.3.2.7.2', 'calc', congItems));

    // ---- SOLAS II-2/13.3.2.2: two means of escape from every space
    var twoItems = [];
    cfg.zones.forEach(function (z) {
      if (!(z.persons > 0)) { return; }
      var st = uniq(cfg.routes.filter(function (r) { return r.zone === z.id; }).map(function (r) { return r.stair; }));
      twoItems.push({ subject: { type: 'zone', id: z.id }, status: st.length >= 2 ? 'pass' : 'fail', stairs: st.length });
    });
    checks.push(check('solas_two_means', 'evac', 'SOLAS II-2/13.3.2.2', 'calc', twoItems));

    // ---- FSS 13.2.1.1 and 2.1.2: stairway width for the persons it serves
    var widthItems = cfg.stairs.map(function (s) {
      var nThis = L.stairN[s.id] || 0;
      var others = (s.otherDecks || []).filter(isNum);
      var list = [nThis].concat(others).sort(function (x, y) { return y - x; }).slice(0, 4);
      var coef = [1, 1, 0.5, 0.25];
      var sz = 0;
      list.forEach(function (n, i) { sz += coef[i] * n; });
      sized[s.id] = sz;
      var required = Math.max(C.FSS_STAIR_MIN_MM, sz * C.FSS_MM_PER_PERSON);
      var provided = s.width * 1000;
      var st = invalid('cfg.' + cfg.id + '.stairs.' + s.id + '.otherDecks') ? 'data' : (provided + 1e-6 >= required ? 'pass' : 'fail');
      return { subject: { type: 'stair', id: s.id }, status: st, n: nThis, others: others, sized: sz, required: required, provided: provided, over: required > C.FSS_HANDRAIL_MAX_MM + EPS };
    });
    checks.push(check('fss_stair_width', 'fss', 'FSS Code 13.2.1.1, 13.2.1.2', 'calc', widthItems));

    // ---- FSS 13.2.2.1: handrails on both sides, at most 1,800 mm between handrails
    checks.push(check('fss_handrail', 'fss', 'FSS Code 13.2.2.1', 'mixed', cfg.stairs.map(function (s) {
      var widthOk = s.width * 1000 <= C.FSS_HANDRAIL_MAX_MM + 1e-6;
      var d = declStatus(s.handrails);
      return { subject: { type: 'stair', id: s.id }, status: worst([d, widthOk ? 'pass' : 'confirm']), decl: s.handrails, width: s.width * 1000, widthOk: widthOk };
    })));

    // ---- FSS 13.2.2.2: stairways sized for more than 90 persons aligned fore and aft
    checks.push(check('fss_alignment', 'fss', 'FSS Code 13.2.2.2', 'decl', cfg.stairs.map(function (s) {
      var sz = sized[s.id];
      var st = sz > C.FSS_ALIGN_PERSONS + EPS ? (s.orient === 'fa' ? 'pass' : (s.orient === 'ath' ? 'fail' : 'data')) : 'na';
      return { subject: { type: 'stair', id: s.id }, status: st, sized: sz, orient: s.orient };
    })));

    // ---- FSS 13.2.2.3: vertical rise without landing and inclination
    checks.push(check('fss_rise_angle', 'fss', 'FSS Code 13.2.2.3', 'calc', cfg.stairs.map(function (s) {
      var riseOk = s.rise <= C.FSS_RISE_MAX + EPS, angleOk = s.angle <= C.FSS_ANGLE_MAX + EPS;
      return { subject: { type: 'stair', id: s.id }, status: riseOk && angleOk ? 'pass' : 'fail', rise: s.rise, angle: s.angle, riseOk: riseOk, angleOk: angleOk };
    })));

    // ---- FSS 13.2.2.4: landing area at each deck level. The requirement "need not exceed 16 m²,
    // except for those landings servicing public spaces having direct access onto the stairway
    // enclosure": the 16 m² cap applies only when the landing does NOT serve such public spaces.
    checks.push(check('fss_landing', 'fss', 'FSS Code 13.2.2.4', 'calc', cfg.stairs.map(function (s) {
      var n = L.stairN[s.id] || 0;
      var raw = C.FSS_LANDING_MIN + Math.max(0, n - C.FSS_LANDING_FREE) / C.FSS_LANDING_PER;
      var required = raw, capApplies = null;
      if (raw > C.FSS_LANDING_CAP + EPS) {
        if (s.landingPublic === 'no') { required = C.FSS_LANDING_CAP; capApplies = true; }
        else if (s.landingPublic === 'yes') { capApplies = false; }
      }
      var path = 'cfg.' + cfg.id + '.stairs.' + s.id + '.landing';
      var st;
      if (!isNum(s.landing) || invalid(path)) { st = 'data'; }
      else if (s.landing + 1e-6 >= raw) { st = 'pass'; }
      else if (raw > C.FSS_LANDING_CAP + EPS && capApplies === null) { st = s.landing + 1e-6 >= C.FSS_LANDING_CAP ? 'data' : 'fail'; }
      else { st = s.landing + 1e-6 >= required ? 'pass' : 'fail'; }
      return { subject: { type: 'stair', id: s.id }, status: st, n: n, required: required, raw: raw, provided: s.landing, capApplies: capApplies };
    })));

    // ---- FSS 13.2.3.1: doorways and corridors sized in the same manner as stairways
    var elItems = [];
    cfg.stairs.forEach(function (s) {
      Object.keys(L.elemN[s.id]).forEach(function (eid) {
        var e = eMap[eid];
        var n = L.elemN[s.id][eid];
        if (!e || !(n > EPS)) { return; }
        var required = n * C.FSS_MM_PER_PERSON;
        var provided = e.width * 1000;
        var openings = isNum(e.openings) && e.openings >= 1 ? Math.round(e.openings) : 1;
        var perOpening = provided / openings;
        var st = provided + 1e-6 >= required ? (perOpening < C.FSS_DOOR_MIN_MM - 1e-6 ? 'confirm' : 'pass') : 'fail';
        elItems.push({ subject: { type: 'element', id: eid, stair: s.id }, status: st, kind: e.kind, n: n, required: required, provided: provided, openings: openings, perOpening: perOpening, under900: perOpening < C.FSS_DOOR_MIN_MM - 1e-6 });
      });
    });
    checks.push(check('fss_element_width', 'fss', 'FSS Code 13.2.3.1', 'calc', elItems));

    // ---- FSS 13.2.3.2: stairway exit doors to the assembly station
    var exitMissing = cfg.stairs.filter(function (s) { return !isNum(s.exitWidth) || invalid('cfg.' + cfg.id + '.stairs.' + s.id + '.exitWidth'); }).map(function (s) { return s.id; });
    var sumExit = sum(cfg.stairs.map(function (s) { return isNum(s.exitWidth) ? s.exitWidth * 1000 : 0; }));
    var sumStairs = sum(cfg.stairs.map(function (s) { return s.width * 1000; }));
    checks.push(check('fss_exit_doors', 'fss', 'FSS Code 13.2.3.2', 'calc', [{
      subject: { type: 'ship' }, status: exitMissing.length ? 'data' : (sumExit + 1e-6 >= sumStairs ? 'pass' : 'fail'),
      provided: sumExit, required: sumStairs, missing: exitMissing
    }]));

    // ---- SOLAS II-2/13.3.2.4.1: an enclosed stairway giving continuous fire shelter
    var sMap = byId(cfg.stairs);
    checks.push(check('solas_enclosed', 'solas', 'SOLAS II-2/13.3.2.4.1', 'decl', cfg.zones.filter(function (z) { return z.persons > 0; }).map(function (z) {
      var st = uniq(cfg.routes.filter(function (r) { return r.zone === z.id; }).map(function (r) { return r.stair; })).filter(function (id) { return sMap[id]; });
      var yes = st.filter(function (id) { return sMap[id].enclosed === 'yes'; });
      var no = st.filter(function (id) { return sMap[id].enclosed === 'no'; });
      return { subject: { type: 'zone', id: z.id }, status: yes.length ? 'pass' : (no.length === st.length && st.length ? 'fail' : 'data'), enclosed: yes, stairs: st };
    })));

    // ---- ship-level declarations, SOLAS II-2/13.3.2.1.1, 13.3.2.5.1, 13.3.2.6.1, 13.3.2.6.2
    var dc = a.meta.decl || {};
    var below = dc.belowBulkhead === 'no' ? 'na' : (dc.belowBulkhead === 'yes' ? declStatus(dc.wtIndependent) : 'data');
    checks.push(check('solas_below_bulkhead', 'solas', 'SOLAS II-2/13.3.2.1.1', 'decl', [{ subject: { type: 'ship' }, status: below, below: dc.belowBulkhead, decl: dc.wtIndependent }]));
    checks.push(check('solas_lll', 'solas', 'SOLAS II-2/13.3.2.5.1', 'decl', [{ subject: { type: 'ship' }, status: declStatus(dc.lll), decl: dc.lll }]));
    checks.push(check('solas_no_keys', 'solas', 'SOLAS II-2/13.3.2.6.1', 'decl', [{ subject: { type: 'ship' }, status: declStatus(dc.noKeys), decl: dc.noKeys }]));
    checks.push(check('solas_quick_release', 'solas', 'SOLAS II-2/13.3.2.6.2', 'decl', [{ subject: { type: 'ship' }, status: declStatus(dc.quickRelease), decl: dc.quickRelease }]));

    // ---- SOLAS III/11.2: muster station area
    var musterReq = C.MUSTER_M2_PER_PERSON * cfgRes.total;
    checks.push(check('solas_muster', 'solas', 'SOLAS III/11.2', 'calc', [{
      subject: { type: 'ship' }, status: !isNum(a.meta.musterArea) ? 'data' : (a.meta.musterArea + 1e-6 >= musterReq ? 'pass' : 'fail'),
      required: musterReq, provided: a.meta.musterArea, persons: cfgRes.total
    }]));

    var counts = { pass: 0, fail: 0, confirm: 0, data: 0, na: 0 };
    checks.forEach(function (c) { counts[c.status]++; });
    return { basis: basis, loads: L, checks: checks, counts: counts };
  }

  // ------------------------------------------------------------ what-if
  /**
   * "What if" for the active configuration: stairways and approach elements tagged with the chosen
   * area cannot be used, persons on board change, and the rescue inputs worsen. With items lost the
   * case is treated as a secondary case of Circ.1533 (gamma 1.3); without items lost the normal
   * evaluation applies to the new number of persons.
   */
  function whatIf(a, res) {
    var w = a.whatif;
    if (!w || !res.ok) { return null; }
    var cfg = a.configs.filter(function (c) { return c.id === res.active; })[0];
    var base = res.configs.filter(function (c) { return c.id === res.active; })[0];
    var bad = res.issues.some(function (i) { return i.level === 'error' && /^whatif\./.test(i.path); });
    if (bad) { return { ok: false, reason: 'invalid' }; }
    var loc = w.location || 'none';
    var lostS = loc === 'none' ? [] : cfg.stairs.filter(function (s) { return s.area === loc; }).map(function (s) { return s.id; });
    var lostE = loc === 'none' ? [] : cfg.elements.filter(function (e) { return e.area === loc; }).map(function (e) { return e.id; });
    var total = w.loadPct ? Math.round(base.total * (1 + w.loadPct / 100)) : base.total;
    var routes = cfg.routes.filter(function (r) {
      return lostS.indexOf(r.stair) < 0 && lostE.indexOf(r.door) < 0 && lostE.indexOf(r.corridor) < 0;
    }).map(function (r) { return clone(r); });
    var trapped = [], promoted = [];
    cfg.zones.forEach(function (z) {
      if (!(z.persons > 0)) { return; }
      var mine = routes.filter(function (r) { return r.zone === z.id; });
      if (!mine.length) { trapped.push(z.id); return; }
      if (!mine.some(function (r) { return r.kind === 'primary'; })) {
        mine.forEach(function (r) { r.kind = 'primary'; });
        promoted.push(z.id);
      }
    });
    var mod = { id: cfg.id, name: cfg.name, zones: cfg.zones, elements: cfg.elements, routes: routes, stairs: cfg.stairs.filter(function (s) { return lostS.indexOf(s.id) < 0; }) };
    var evac;
    if (trapped.length) {
      evac = { computed: false, trapped: trapped, met: false };
    } else if (!lostS.length && !lostE.length) {
      var cr = computeConfig(mod, a, total);
      evac = { computed: true, mode: 'normal', night: cr.governing.night, day: cr.governing.day, scenario: cr.governing.scenario, govStair: cr.scenarios[cr.governing.scenario].govStair, met: cr.vesselMet, secondaryFailed: cr.scenarios.S.failed, maxPersons: cr.capacity.maxPersons };
    } else {
      var ctx = makeCtx(mod, a, total);
      var A1 = balancedScenario(ctx, null, C.GAMMA_SECONDARY);
      var B1 = nearestScenario(ctx, C.GAMMA_SECONDARY);
      var g = !A1.failed && A1.night >= B1.night - EPS ? A1 : B1;
      var key = g === A1 ? 'A' : 'B';
      evac = { computed: true, mode: 'lost', night: g.night, day: g.day, scenario: key, govStair: g.govStair, met: g.night <= C.N_LIMIT + EPS, rowsA: A1.rows, rowsB: B1.rows, tImaxA: A1.tImax, tImaxB: B1.tImax };
    }
    var rk = w.rescue === 'ref' || !w.rescue ? a.route.ref : w.rescue;
    var rescue = rescueOf(a.route.distance, a.route.sc[rk], w.notifAdd, w.speedPct);
    rescue.key = rk;
    var baseRescue = res.rescue.sc[a.route.ref];
    return {
      ok: true, location: loc, lostStairs: lostS, lostElements: lostE, trapped: trapped, promoted: promoted,
      total: total, baseTotal: base.total, overCert: isNum(a.meta.certCapacity) && total > a.meta.certCapacity + EPS,
      evac: evac, rescue: rescue,
      quadrant: quadrantOf(evac.met, rescue.met),
      baseline: { quadrant: res.verdict.quadrant, evac: base.governing.night, sar: baseRescue.total, rescueKey: a.route.ref },
      changed: !!(lostS.length || lostE.length || w.loadPct || w.notifAdd || w.speedPct || rk !== a.route.ref)
    };
  }

  // ------------------------------------------------------------ findings
  /** Findings drive the recommendations. Order: critical, warning, info; within a level by impact. */
  function findingsFor(a, res, cfgRes) {
    var F = [];
    function add(level, code, rank, params) { F.push({ level: level, code: code, rank: rank, params: params || {} }); }
    var rescue = res.rescue;
    var status = a.meta && a.meta.shipStatus === 'new' ? 'new' : 'existing';
    if (cfgRes && cfgRes.ok) {
      var S = cfgRes.scenarios.S;
      S.failedCases.forEach(function (fc) { add('critical', 'second_route_missing', 10, { stair: fc.removed, zones: fc.disconnected }); });
      if (cfgRes.governing.night > C.N_LIMIT + EPS) {
        var g = cfgRes.scenarios[cfgRes.governing.scenario];
        add('critical', 'evac_exceeded', 20, { value: cfgRes.governing.night, over: cfgRes.governing.night - C.N_LIMIT, scenario: cfgRes.governing.scenario, stair: g.govStair, removed: g.removed || null, status: status });
        cfgRes.capacity.requirements.forEach(function (rq) { add('critical', 'width_required', 21, rq); });
        cfgRes.capacity.tooLong.forEach(function (tl) { add('critical', 'route_too_long', 22, tl); });
      } else if (!S.failed && cfgRes.margin < 0.1 * C.N_LIMIT) {
        add('warning', 'evac_margin_low', 40, { margin: cfgRes.margin, value: cfgRes.governing.night });
      }
      if (cfgRes.crewValue > 0.05) {
        var Bg = cfgRes.scenarios.B;
        var row = Bg.rows.filter(function (r) { return r.stair === Bg.govStair; })[0];
        add(cfgRes.governing.scenario === 'B' && cfgRes.crewValue >= 3 ? 'warning' : 'info', 'crew_direction', 34,
          { gain: cfgRes.crewValue, stair: Bg.govStair, persons: row ? row.n : null, a: cfgRes.scenarios.A.night, b: Bg.night });
      }
      cfgRes.congestion.forEach(function (cg) { add('warning', 'congestion', 50, cg); });
      cfgRes.density.forEach(function (d) { if (d.congested) { add('warning', 'congestion_density', 51, d); } });
      if (isNum(a.meta.certCapacity) && cfgRes.total > a.meta.certCapacity + EPS) {
        add('warning', 'capacity_exceeded', 30, { value: cfgRes.total, limit: a.meta.certCapacity });
      }
      if (isNum(a.meta.musterArea)) {
        var reqA = C.MUSTER_M2_PER_PERSON * cfgRes.total;
        if (a.meta.musterArea + EPS < reqA) {
          add('warning', 'muster_deficit', 38, { required: reqA, provided: a.meta.musterArea, deficit: reqA - a.meta.musterArea, persons: cfgRes.total });
        }
      }
      var rl = res.rules && res.rules[cfgRes.id];
      if (rl) {
        rl.checks.forEach(function (ck) {
          ck.items.forEach(function (it) {
            if (it.status !== 'fail') { return; }
            var p = { check: ck.id, clause: ck.clause, item: it };
            if (ck.id === 'fss_stair_width') { add('warning', 'fss_stair_width', 24, p); }
            else if (ck.id === 'fss_element_width') { add('warning', 'fss_element_width', 25, p); }
            else if (ck.id === 'fss_exit_doors') { add('warning', 'fss_exit_doors', 26, p); }
            else if (ck.id === 'fss_rise_angle') { add('warning', 'fss_rise_angle', 27, p); }
            else if (ck.id === 'fss_landing') { add('warning', 'fss_landing', 28, p); }
            else if (ck.id === 'fss_alignment' || ck.id === 'fss_handrail') { add('warning', ck.id, 29, p); }
            else if (ck.id === 'solas_enclosed') { add('warning', 'solas_enclosed', 23, p); }
            else if (ck.id === 'solas_lll' || ck.id === 'solas_no_keys' || ck.id === 'solas_quick_release' || ck.id === 'solas_below_bulkhead') { add('warning', 'solas_decl', 31, p); }
          });
        });
        if (rl.counts.confirm) { add('info', 'rules_confirm', 68, { n: rl.counts.confirm }); }
        if (rl.counts.data) { add('info', 'rules_data', 69, { n: rl.counts.data }); }
      }
      if (cfgRes.capacity.maxPersons !== null) {
        add('info', 'max_persons', 65, { value: cfgRes.capacity.maxPersons, limiting: cfgRes.capacity.limiting, total: cfgRes.total });
      }
    }
    if (rescue) {
      var r = rescue.sc[rescue.ref];
      if (!r.met) { add('critical', 'rescue_exceeded', 15, { scenario: rescue.ref, value: r.total, over: -r.margin, crit: r.critNotif, notif: r.notif }); }
      else if (r.margin < 0.1 * C.SAR_LIMIT) { add('warning', 'rescue_margin_low', 32, { scenario: rescue.ref, margin: r.margin, crit: r.critNotif, notif: r.notif }); }
      else { add('info', 'notify_deadline', 60, { scenario: rescue.ref, crit: r.critNotif, notif: r.notif }); }
      RESCUE_KEYS.forEach(function (k) {
        var s = rescue.sc[k];
        if (s.travelAbove) { add('warning', 'sar_base_far', 33, { scenario: k, travel: s.travel }); }
        if (s.prepAbove) { add('warning', 'prep_slow', 36, { scenario: k, prep: s.prep }); }
      });
    }
    if (cfgRes && cfgRes.ok) {
      var best = null;
      res.configs.forEach(function (c) {
        if (c.id !== cfgRes.id && c.ok && !c.scenarios.S.failed && c.governing.night < cfgRes.governing.night - 0.05) {
          if (!best || c.governing.night < best.governing.night) { best = c; }
        }
      });
      if (best) {
        add('info', 'best_alternative', 55, { cfg: best.id, gain: cfgRes.governing.night - best.governing.night, pct: (cfgRes.governing.night - best.governing.night) / cfgRes.governing.night * 100, value: best.governing.night });
      }
    }
    var lvl = { critical: 0, warning: 1, info: 2 };
    F.sort(function (x, y) { return (lvl[x.level] - lvl[y.level]) || (x.rank - y.rank); });
    return F;
  }

  /**
   * Evaluate a complete assessment (schema 2; schema 1 is accepted after normalize()).
   * @param {any} a
   */
  function evaluate(a) {
    var issues = validate(a);
    var errors = issues.filter(function (i) { return i.level === 'error'; });
    var blocking = errors.filter(function (i) { return i.scope !== 'rules' && !/^whatif\./.test(i.path); });
    var globalErr = blocking.filter(function (i) { return i.cfg === null; });
    var timeErr = globalErr.some(function (i) { return i.path === 'time.EL' || i.path === 'load.target' || i.path === 'configs' || i.path === '' || i.path === 'active'; });
    var routeErr = globalErr.some(function (i) { return i.path.indexOf('route.') === 0; });
    var res = {
      engine: ENGINE_VERSION, constants: CONSTANTS_VERSION, issues: issues,
      errorCount: errors.length,
      blockingCount: blocking.length,
      warningCount: issues.length - errors.length,
      configs: [], rescue: null, matrix: [], active: null, findings: [], rules: {}, whatif: null, ok: false
    };
    (Array.isArray(a && a.configs) ? a.configs : []).forEach(function (cfg) {
      var bad = timeErr || blocking.some(function (i) { return i.cfg === cfg.id; });
      var cr = bad ? { id: cfg.id, ok: false } : computeConfig(cfg, a);
      res.configs.push(cr);
      if (cr.ok) { res.rules[cfg.id] = rulesFor(a, cfg, cr, issues); }
    });
    if (!routeErr && a && a.route) { res.rescue = computeRescue(a.route); }
    res.configs.forEach(function (c) {
      if (!c.ok || !res.rescue) { return; }
      RESCUE_KEYS.forEach(function (k) {
        var r = res.rescue.sc[k];
        res.matrix.push({ cfg: c.id, rescue: k, evac: c.governing.night, sar: r.total, vesselMet: c.vesselMet, rescueMet: r.met, quadrant: quadrantOf(c.vesselMet, r.met) });
      });
    });
    var act = res.configs.filter(function (c) { return a && c.id === a.active; })[0] || null;
    res.active = act ? act.id : null;
    res.ok = !!(act && act.ok && res.rescue);
    if (res.ok) {
      var refRes = res.rescue.sc[res.rescue.ref];
      res.verdict = {
        quadrant: quadrantOf(act.vesselMet, refRes.met),
        evac: act.governing.night, evacScenario: act.governing.scenario, evacMargin: act.margin,
        sar: refRes.total, sarMargin: refRes.margin, rescueRef: res.rescue.ref,
        secondaryFailed: act.scenarios.S.failed
      };
      res.whatif = whatIf(a, res);
    }
    res.findings = findingsFor(a, res, act && act.ok ? act : null);
    return res;
  }

  // ------------------------------------------------------------- examples
  /**
   * Vessel A (anonymised) on the Tanjung Api-Api – Tanjung Kalian route, exactly as in the paper
   * (Appendix C geometry, Table 4 rescue scenarios, Table 6 configurations).
   * Data the paper does not give (landing areas, declarations, zone areas) are left empty.
   * @param {string} lang 'id' | 'en'
   */
  function example(lang) {
    var en = lang === 'en';
    var N = {
      pr: en ? 'Passenger Room' : 'Ruang Penumpang',
      lb: en ? 'Lobby' : 'Lobi',
      ek: en ? 'Economy Sleeping Room I' : 'Ruang Tidur Ekonomi I',

    // guide
    'gd.mulai': 'Mulai cepat', 'gd.apa': 'Apa itu FIRE-MAR', 'gd.baca': 'Membaca hasil', 'gd.skenario': 'Skenario evakuasi', 'gd.aturan': 'Pemeriksaan aturan',
