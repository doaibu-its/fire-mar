    'gd.start.1': 'Isi data kapal: zona penumpang, tangga, pintu dan lorong, lalu jalur dari setiap zona ke tangga.',
    'gd.start.2': 'Isi rute dan SAR: jarak terjauh dari pos SAR dan tiga skenario waktu.',
    'gd.start.3': 'Baca ringkasan: kategori, dua angka utama dan rekomendasi.',
    'gd.start.4': 'Periksa aturan: lengkapi pernyataan dan ukuran tambahan yang diminta.',
    'gd.start.5': 'Lengkapi laporan, lalu buat PDF. Simpan file .json agar penilaian dapat dibuka lagi.',
    'gd.what.p1': 'FIRE-MAR menilai satu kapal Ro-Pax pada satu rute penyeberangan. Ada dua sumbu yang dinilai terpisah: apakah semua orang dapat dievakuasi dalam 60 menit (IMO MSC.1/Circ.1533, metode sederhana), dan apakah bantuan SAR dapat tiba dalam 175 menit sejak kebakaran dimulai (Peraturan Basarnas No. 6/2022 ditambah waktu notifikasi).',
    'gd.what.p2': 'Hasilnya satu dari empat kategori. Setiap kategori menunjuk prioritas yang berbeda: perbaikan di kapal, kesiapan SAR di rute, atau keduanya. Halaman Pemeriksaan aturan melengkapi hasil ini dengan pasal ukuran jalan keluar yang dapat diperiksa dari data yang sama.',
    'gd.what.p3': 'FIRE-MAR tidak mencegah kebakaran. FIRE-MAR membantu menentukan apa yang perlu diperbaiki lebih dulu supaya orang di kapal tetap selamat bila kebakaran terjadi.',
    'gd.signs': 'Arti tanda status', 'gd.signs.p': 'Bentuk dan warna tanda meminjam bentuk dasar warna keselamatan ISO 3864: kotak hijau untuk aman, segitiga kuning untuk peringatan, lingkaran biru untuk wajib, lingkaran merah untuk tidak memenuhi.',
    'gd.scen.p': 'Setiap skenario dihitung untuk malam (R = 10 menit) dan siang (R = 5 menit). Malam selalu lebih lama dan dipakai sebagai penentu.',
    'gd.scen.sar': 'Untuk akses SAR, skenario optimis, dasar dan pesimis mengapit ketidakpastian waktu notifikasi, persiapan dan kecepatan unit SAR. Skenario acuan dipakai untuk kesimpulan.',
    'gd.rules.p1': 'Halaman Pemeriksaan aturan menilai pasal yang dapat diperiksa dari data FIRE-MAR: lebar tangga, pintu dan lorong menurut jumlah orang, tinggi dan sudut tangga, luas bordes dan muster station, dua jalan keluar, serta pernyataan penilai untuk perlengkapan yang tidak dapat dihitung.',
    'gd.rules.p2': 'Setiap pemeriksaan menyebut nomor pasal, syaratnya, angka yang dipakai, dan dasar penilaiannya: dihitung dari data atau pernyataan penilai. Status “Perlu data” berarti FIRE-MAR tidak mengambil kesimpulan sebelum data diisi.',
    'gd.rules.p3': 'Pasal SOLAS dan FSS Code mengikat kapal berbendera konvensi. Untuk kapal domestik non-konvensi, hasilnya acuan pembanding. FIRE-MAR tidak memeriksa aturan klas BKI dan standar NCVS.',
    'gd.whatif.p1': 'Uji skenario menghitung ulang untuk kondisi kejadian: tangga atau pintu di lokasi api tidak dapat dipakai, jumlah orang di kapal lebih banyak dari data, laporan ke SAR terlambat, atau unit SAR melambat karena cuaca.',
    'gd.whatif.p2': 'Hasilnya dibandingkan dengan kondisi dasar. Uji skenario tidak memodelkan penyebaran api, asap atau kepanikan. Uji ini menjawab pertanyaan “bagaimana jika” dengan metode yang sama.',
    'gd.measure.p': 'Pakai skala gambar, misalnya jarak gading yang tertulis di GA. Semua ukuran adalah lebar atau panjang bersih.',
    'gd.measure.1': 'Lebar tangga: jarak bersih di antara pegangan tangan.',
    'gd.measure.2': 'Lebar pintu: bukaan bersih saat terbuka penuh. Untuk beberapa pintu sejajar, isi jumlah lebarnya dan jumlah bukaannya.',
    'gd.measure.3': 'Panjang jalur: dari titik terjauh zona sampai kaki tangga, mengikuti lorong yang dilalui.',
    'gd.measure.4': 'Puncak tangga ke muster: dari ujung atas tangga sampai pintu muster station.',
    'gd.measure.5': 'Tinggi segmen dan sudut tangga: dari gambar profil. Satu segmen adalah tangga di antara dua lantai atau bordes.',
    'gd.measure.6': 'Luas zona, bordes dan muster station: luas lantai bebas yang dapat dipakai.',
    'gd.sources': 'Sumber', 'gd.limits': 'Batas penggunaan',
    'gd.limits.1': 'Memakai metode sederhana Circ.1533: asap, panas, perilaku kelompok, gerak, oleng dan trim kapal tidak dimodelkan. Yang dihitung adalah waktu evakuasi yang dibutuhkan, bukan waktu yang tersedia sebelum kondisi tidak dapat ditahan.',
    'gd.limits.2': 'Panjang jalur diukur dari titik terjauh zona, termasuk di dalam ruang publik. Ini lebih konservatif daripada Appendix 1 §2.2.8, yang tidak menghitung t dek untuk ruang publik.',
    'gd.limits.3': 'Aliran masuk di kaki tangga diambil dari jalur masuk terbesar. Bila beberapa pintu terpisah mengalir ke tangga yang sama, selisih aliran sebenarnya bisa lebih besar.',

    'st.title': 'Statement of use', 'st.sub': 'Applies to every FIRE-MAR result and report.',
    'stm.1': 'FIRE-MAR is an early screening tool that helps set priorities for improving vessel evacuation and SAR preparedness on one route. It does not give approvals, certificates or permits.',
    'stm.2': 'The evacuation duration is calculated by the simplified method of IMO MSC.1/Circ.1533. The method does not model smoke, heat, family-group behaviour, ship motion, heel or trim (Annex 1 §3.2).',
    'stm.3': 'The checks of SOLAS II-2/13, FSS Code chapter 13 and SOLAS III/11 use the data and declarations entered by the user. For non-convention domestic ships these provisions serve as a benchmark unless national or class rules have adopted them.',
    'stm.4': 'FIRE-MAR does not check BKI class rules or the non-convention vessel standard (KM 65 of 2009).',
    'stm.5': 'The calculated limit of persons is a calculation, not a permitted load. The capacity on the ship’s certificate still applies.',
    'stm.6': 'Before results are used for design or operational decisions, a competent person must check them against the measurements on board, and they must be confirmed by the classification society or the Directorate General of Sea Transportation.',

    'gd.mulai': 'Quick start', 'gd.apa': 'What FIRE-MAR is', 'gd.baca': 'Reading the results', 'gd.skenario': 'Evacuation scenarios', 'gd.aturan': 'Rule checks',
    'gd.uji': 'What-if', 'gd.ukur': 'Measuring from the GA drawing', 'gd.istilah': 'Terms', 'gd.konstanta': 'Constants and sources', 'gd.batas': 'Statement and limits of use', 'gd.tentang': 'About',
    'gd.start.1': 'Enter the vessel data: passenger zones, stairways, doors and corridors, then the routes from each zone to the stairways.',
    'gd.start.2': 'Enter the route and SAR data: the farthest distance from the SAR base and three timing scenarios.',
    'gd.start.3': 'Read the summary: the category, the two key figures and the recommendations.',
    'gd.start.4': 'Check the rules: add the declarations and extra measurements requested.',
    'gd.start.5': 'Complete the report and create the PDF. Save the .json file to reopen the assessment later.',
    'gd.what.p1': 'FIRE-MAR assesses one ro-pax ferry on one crossing route. Two axes are judged separately: whether everyone can be evacuated within 60 min (IMO MSC.1/Circ.1533, simplified method), and whether SAR help can arrive within 175 min of the fire starting (Basarnas Regulation No. 6/2022 plus the notification time).',
    'gd.what.p2': 'The result is one of four categories. Each points to a different priority: work on the ship, SAR preparedness on the route, or both. The Rule checks page complements it with the means-of-escape provisions that can be checked from the same data.',
    'gd.what.p3': 'FIRE-MAR does not prevent fires. It helps decide what to improve first so that the people on board stay safe if a fire happens.',
    'gd.signs': 'Status marks', 'gd.signs.p': 'The marks borrow the basic shapes and safety colours of ISO 3864: green square for safe, yellow triangle for warning, blue circle for mandatory, red circle for not met.',
    'gd.scen.p': 'Each scenario is calculated for night (R = 10 min) and day (R = 5 min). Night always takes longer and governs.',
    'gd.scen.sar': 'For SAR access, the optimistic, base and pessimistic scenarios bracket the uncertainty in notification, preparation and rescue unit speed. The reference scenario is used for the conclusion.',
    'gd.rules.p1': 'The Rule checks page judges the provisions that can be checked from FIRE-MAR data: stairway, door and corridor widths for the persons served, stair rise and angle, landing and muster areas, two means of escape, and assessor declarations for arrangements that cannot be calculated.',
    'gd.rules.p2': 'Each check names its provision, the requirement, the figures used and its basis: calculated from data or declared by the assessor. “Data needed” means FIRE-MAR draws no conclusion until the data are entered.',
    'gd.rules.p3': 'SOLAS and FSS Code provisions bind convention ships. For non-convention domestic ships the results are a benchmark. FIRE-MAR does not check BKI class rules or the NCVS standard.',
    'gd.whatif.p1': 'The what-if recalculates for incident conditions: stairways or doors at the fire location unavailable, more persons on board than the data, a late report to SAR, or a rescue unit slowed by weather.',
    'gd.whatif.p2': 'Results are compared with the base condition. The what-if does not model fire spread, smoke or panic. It answers “what if” questions with the same method.',
    'gd.measure.p': 'Use the drawing scale, for example the frame spacing written on the GA. All dimensions are clear widths or lengths.',
    'gd.measure.1': 'Stairway width: clear distance between the handrails.',
    'gd.measure.2': 'Door width: clear opening when fully open. For several parallel doors, enter the total width and the number of openings.',
    'gd.measure.3': 'Route length: from the farthest point of the zone to the foot of the stairway, along the corridors used.',
    'gd.measure.4': 'Stair top to muster: from the top of the stairway to the muster station door.',
    'gd.measure.5': 'Flight rise and stair angle: from the profile drawing. One flight is the stair between two floors or landings.',
    'gd.measure.6': 'Zone, landing and muster areas: usable clear floor area.',
    'gd.sources': 'Sources', 'gd.limits': 'Limits of use',
    'gd.limits.1': 'Uses the simplified method of Circ.1533: smoke, heat, family-group behaviour, ship motion, heel and trim are not modelled. It calculates the evacuation duration required, not the time available before conditions become untenable.',
    'gd.limits.2': 'Route lengths are measured from the farthest point of the zone, including inside public spaces. This is more conservative than Appendix 1 §2.2.8, which calculates no deck travel for public spaces.',
    'gd.limits.3': 'The inlet flow at a stair foot is taken from the largest approach route. If several separate doors feed the same stairway, the real flow difference can be larger.',
    'gd.limits.4': 'Results are only as accurate as the measurements and declarations entered.',
    'gd.limits.5': 'The 175-minute limit is the Basarnas service standard plus the notification time, not a survival time in the water.',
    'gd.limits.6': 'The engine is tested against every figure in the paper, the official FSS Code example (figure 2) and an independent Python model, but it has not been compared with onboard evacuation drill times.',
    'gd.about.p': 'FIRE-MAR {v} (constants {c}) was developed by Team Doa Ibu, Department of Naval Architecture, Institut Teknologi Sepuluh Nopember, from the FIRE-MAR paper for the Sampan Maritime Competition 2026.',
    'gd.about.p2': 'The example ship is anonymised as Vessel A. All calculations run on your device; vessel data are not sent to any server.',
    'gd.fonts': 'Type: Atkinson Hyperlegible Next (Braille Institute) for text, designed so that similar letters and numbers are easy to tell apart, and Barlow Semi Condensed for headings. Both under the SIL Open Font License; a few symbols come from IBM Plex Sans.',
    'gd.privacy': 'All calculations run on your device. Vessel data are not sent to any server.',
    'c.what': 'Quantity', 'c.value': 'Value', 'c.src': 'Source',

    if (pr.min !== undefined) { pr.min = nfIn(pr.min); pr.max = nfIn(pr.max); }
    if (pr.limit !== undefined) { pr.limit = nfp(pr.limit); }
    if (pr.expected) { pr.expected = t('kind.' + pr.expected).toLowerCase(); }
    return t('e.' + i.code, pr);
  }
  var q = Object.assign({}, i.params);
  if (q.limit !== undefined) { q.limit = nfp(q.limit); }
  if (q.value !== undefined) { q.value = nfp(q.value); }

}
function pathLabel(path) {

      if (p[2] === 'routes' && item) { parts.push(zoneLabel(item.zone, cfg) + ' → ' + stairLabel(item.stair, cfg)); }

  var map = { 'meta.certCapacity': t('f.cert'), 'load.target': t('f.target'), 'route.distance': t('f.distance'), 'time.EL': t('f.EL') };
  if (map[path]) { return map[path]; }
  if (path.indexOf('route.sc.') === 0) { return t('g.rescue') + ', ' + t('sc.' + p[2]); }

}
function reasonKey(i) { return i.code + '|' + i.path; }
function pageOfPath(path) {
  if (path.indexOf('cfg.') === 0) {
    if (/\.(exitWidth|landing|landingPublic|handrails|orient|enclosed|otherDecks)$/.test(path)) { return 'aturan'; }
    if (/\.area$/.test(path) && /\.(stairs|elements)\./.test(path)) { return 'uji-skenario'; }

}

function drawDiagram() {
  var host = $('#diagram');

  var zw = narrow ? Math.round(W * 0.42) : Math.min(220, Math.round(W * 0.3));
  var sw = narrow ? Math.round(W * 0.45) : Math.min(210, Math.round(W * 0.29));
  var mw = narrow ? 0 : Math.min(136, Math.round(W * 0.16));
  var zx = 0, sx = narrow ? W - sw : Math.round(zw + (W - zw - sw - mw) * 0.55), mx = W - mw;
  var zh = 48, sh = 80, gap = 12;
  var zH = zones.length * zh + (zones.length - 1) * gap;
  var sH = stairs.length * sh + (stairs.length - 1) * gap;

  stairs.forEach(function (s, i) { spos[s.id] = sy0 + i * (sh + gap); });

  if (k === 'B') {
    cfg.zones.forEach(function (z) {
      var ch = sc.choice[z.id];
      if (!ch) { return; }
      var n = z.persons * c.scale / ch.length;
      var near = cfg.routes.filter(function (q) { return q.zone === z.id && q.kind === 'primary'; });
      var minL = Math.min.apply(null, near.map(function (q) { return q.length; }));
      near.forEach(function (rt) { if (rt.length <= minL + 1e-9 && ch.indexOf(rt.stair) >= 0) { flow[rt.id] = n; maxFlow = Math.max(maxFlow, n); } });

      '<text x="' + (zx + 12) + '" y="' + (y + 20) + '" font-size="13.5" font-weight="600" fill="var(--ink)">' + esc(trunc(z.name, Math.floor((zw - 18) / 7.4))) + '</text>' +

// ------------------------------------------------------------------ diagnosis matrix (SVG)
function drawMatrix(id, all) {
  var host = document.getElementById(id);
  if (!host) { return; }
  var r = S.res;
  var W = Math.max(280, host.clientWidth || 420);
  var H = Math.round(Math.min(380, Math.max(250, W * (all ? 0.62 : 0.74))));
  var m = { l: 52, r: 14, t: 16, b: 46 };
  var pts = r.matrix.filter(function (p) { return p.cfg === r.active; });
  var others = (all || S.showAlt) ? r.matrix.filter(function (p) { return p.cfg !== r.active && p.rescue === r.rescue.ref; }) : [];
  var xs = pts.concat(others).map(function (p) { return p.evac; }).concat([60]);
  var ys = pts.concat(others).map(function (p) { return p.sar; }).concat([175]);
  var x0 = Math.max(0, Math.floor((Math.min.apply(null, xs) - 8) / 5) * 5);
  var x1 = Math.ceil((Math.max.apply(null, xs) + 6) / 5) * 5;
  x1 = Math.max(x1, Math.ceil((x0 + (60 - x0) * 1.5) / 5) * 5);
  var y1 = Math.ceil(Math.max.apply(null, ys) * 1.12 / 50) * 50;
  var X = function (v) { return m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r); };
  var Y = function (v) { return m.t + (1 - v / y1) * (H - m.t - m.b); };
  var halo = ' paint-order="stroke" stroke="var(--surface)" stroke-width="3.2" stroke-linejoin="round"';
  var g = [];
  var qx = X(60), qy = Y(175), pw = W - m.r, ph = H - m.b;
  g.push('<rect x="' + m.l + '" y="' + qy + '" width="' + (qx - m.l) + '" height="' + (ph - qy) + '" fill="var(--good-soft)"/>');
  g.push('<rect x="' + m.l + '" y="' + m.t + '" width="' + (qx - m.l) + '" height="' + (qy - m.t) + '" fill="var(--warn-soft)"/>');
  g.push('<rect x="' + qx + '" y="' + qy + '" width="' + (pw - qx) + '" height="' + (ph - qy) + '" fill="var(--warn-soft)"/>');
  g.push('<rect x="' + qx + '" y="' + m.t + '" width="' + (pw - qx) + '" height="' + (qy - m.t) + '" fill="var(--crit-soft)"/>');
  var stepX = (x1 - x0) > 40 ? 10 : 5;
  for (var v = Math.ceil(x0 / stepX) * stepX; v <= x1; v += stepX) {
    g.push('<line x1="' + X(v) + '" x2="' + X(v) + '" y1="' + ph + '" y2="' + (ph + 4) + '" stroke="var(--ink-3)"/><text x="' + X(v) + '" y="' + (ph + 17) + '" font-size="11.5" text-anchor="middle" fill="var(--ink-3)">' + v + '</text>');
  }
  var stepY = y1 > 400 ? 100 : 50;
  for (var w = 0; w <= y1; w += stepY) {
    g.push('<line x1="' + (m.l - 4) + '" x2="' + m.l + '" y1="' + Y(w) + '" y2="' + Y(w) + '" stroke="var(--ink-3)"/><text x="' + (m.l - 7) + '" y="' + (Y(w) + 4) + '" font-size="11.5" text-anchor="end" fill="var(--ink-3)">' + w + '</text>');
  }
  g.push('<rect x="' + m.l + '" y="' + m.t + '" width="' + (pw - m.l) + '" height="' + (ph - m.t) + '" fill="none" stroke="var(--line-strong)"/>');
  g.push('<line x1="' + qx + '" x2="' + qx + '" y1="' + m.t + '" y2="' + ph + '" stroke="var(--ink)" stroke-dasharray="5 4" stroke-width="1.2"/>');
  g.push('<line x1="' + m.l + '" x2="' + pw + '" y1="' + qy + '" y2="' + qy + '" stroke="var(--ink)" stroke-dasharray="5 4" stroke-width="1.2"/>');
  var fs = W < 420 ? 10.5 : 12;
  g.push('<text x="' + (m.l + 7) + '" y="' + (ph - 8) + '" font-size="' + fs + '" fill="var(--good)" font-weight="600"' + halo + '>' + esc(t('q.robust')) + '</text>');
  g.push('<text x="' + (m.l + 7) + '" y="' + (m.t + 16) + '" font-size="' + fs + '" fill="var(--warn)" font-weight="600"' + halo + '>' + esc(t('q.rescue_dependent')) + '</text>');
  g.push('<text x="' + (pw - 7) + '" y="' + (ph - 8) + '" font-size="' + fs + '" fill="var(--warn)" font-weight="600" text-anchor="end"' + halo + '>' + esc(t('q.vessel_critical')) + '</text>');
  g.push('<text x="' + (pw - 7) + '" y="' + (m.t + 16) + '" font-size="' + fs + '" fill="var(--crit)" font-weight="600" text-anchor="end"' + halo + '>' + esc(t('q.compound_critical')) + '</text>');
  g.push('<text x="' + ((m.l + pw) / 2) + '" y="' + (H - 7) + '" font-size="12" text-anchor="middle" fill="var(--ink-2)">' + esc(t('m.x')) + '</text>');
  g.push('<text transform="translate(14 ' + ((m.t + ph) / 2) + ') rotate(-90)" font-size="12" text-anchor="middle" fill="var(--ink-2)">' + esc(t('m.y')) + '</text>');
  others.forEach(function (p) {
    var tip = cfgLabel(p.cfg) + ': ' + nf(p.evac, 1) + ' / ' + nf(p.sar, 1) + ' ' + t('unit.min') + ' (' + t('q.' + p.quadrant) + ')';
    g.push('<circle cx="' + X(p.evac) + '" cy="' + Y(p.sar) + '" r="6" fill="var(--surface)" stroke="var(--ink-2)" stroke-width="1.7" data-tip="' + esc(tip) + '"/>');
    g.push('<text x="' + X(p.evac) + '" y="' + (Y(p.sar) + 20) + '" font-size="11.5" text-anchor="middle" fill="var(--ink-2)"' + halo + '>' + esc(trunc(cfgLabel(p.cfg), 16)) + '</text>');
  });
  var placed = [];
  pts.forEach(function (p) {
    var cx = X(p.evac), cy = Y(p.sar);
    var ref = p.rescue === r.rescue.ref;
    var tip = t('sc.' + p.rescue) + ': ' + nf(p.evac, 1) + ' / ' + nf(p.sar, 1) + ' ' + t('unit.min') + ' (' + t('q.' + p.quadrant) + ')';
    g.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + (ref ? 8 : 6) + '" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" data-tip="' + esc(tip) + '"/>');
    if (ref) { g.push('<circle cx="' + cx + '" cy="' + cy + '" r="12.5" fill="none" stroke="var(--accent)" stroke-width="1.6"/>'); }
    var ly = cy + 4;
    placed.forEach(function (py) { if (Math.abs(py - ly) < 15) { ly = py + (ly >= py ? 15 : -15); } });
    placed.push(ly);
    var label = t('sc.' + p.rescue) + ' ' + nf(p.sar, 0);
    var labelW = (label.length + 1) * 6.9;
    var right = cx + 17 + labelW < pw - 4;
    g.push('<text x="' + (right ? cx + 17 : cx - 17) + '" y="' + ly + '" font-size="12" text-anchor="' + (right ? 'start' : 'end') + '" fill="var(--ink)"' + (ref ? ' font-weight="600"' : '') + halo + '>' + esc(label) + '</text>');
  });
  g.push('<text x="' + (pw - 5) + '" y="' + (qy - 6) + '" font-size="11.5" fill="var(--ink)" text-anchor="end"' + halo + '>175</text>');
  g.push('<text x="' + (qx + 5) + '" y="' + (ph - 24) + '" font-size="11.5" fill="var(--ink)"' + halo + '>60</text>');
  host.innerHTML = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('m.title')) + '">' + g.join('') + '</svg>';
}

    rescue_exceeded: function () { return { t: { o: nf(p.over, 1), sc: sc(p.scenario) }, d: { c: nf(p.crit, 1), n: nf(p.notif, 1) }, dx: p.crit <= 0, go: 'penyelamatan' }; },

    fss_rise_angle: function () { return { t: { st: stairLabel(it.subject.id) }, d: { r: nf(it.rise, 2), a: nf(it.angle, 0) }, go: 'aturan' }; },

// ------------------------------------------------------------------ readouts
function evacReadout(c, key) {
  key = key || c.governing.scenario;
  var sc = c.scenarios[key];
  var night = key === c.governing.scenario ? c.governing.night : sc.night;
  var R = C.SAFETY * C.R_NIGHT, T = C.SAFETY * sc.T, EL = (2 / 3) * S.a.time.EL;
  var parts = [{ k: t('seg.R'), v: R }, { k: t('seg.T'), v: T }, { k: t('seg.EL'), v: EL }];
  var failS = key === 'S' && sc.failed;
  var over = !failS && night > C.N_LIMIT + 1e-9;
  var level = (failS || (key === c.governing.scenario && c.scenarios.S.failed)) || over ? 'fail' : (C.N_LIMIT - night < 6 ? 'confirm' : 'pass');
  var status = (failS || (key === c.governing.scenario && c.scenarios.S.failed)) ? t('b.noSecond') : (over ? t('b.over', { o: nf(night - C.N_LIMIT, 1) }) : t('b.met', { m: nf(C.N_LIMIT - night, 1) }));
  return '<div class="r-top"><span class="fig">' + (failS ? '–' : nf(night, 1)) + '</span><span class="of">' + esc(t('b.of', { l: '60' })) + '</span></div>' +
    '<div class="state-line status-' + stTone(level) + '">' + sign(level, 'sm') + esc(status) + '</div>' +
    (failS ? '' : budgetBar(parts, night, C.N_LIMIT, '60') + budgetLegend(parts)) +
    '<p class="cap">' + esc(t('b.evacCap', { sc: t('scn.' + key), st: stairLabel(sc.govStair || ''), f: nf(c.fixedPart, 1), t: nf(T, 1) })) + '</p>';
}
function sarReadout(k) {
  var s = S.res.rescue.sc[k];
  var parts = [{ k: t('seg.notif'), v: s.notif }, { k: t('seg.prep'), v: s.prep }, { k: t('seg.travel'), v: s.travel }];
  var level = !s.met ? 'fail' : (s.margin < 17.5 ? 'confirm' : 'pass');
  var status = s.met ? t('b.met', { m: nf(s.margin, 1) }) : t('b.over', { o: nf(-s.margin, 1) });
  var cap = s.critNotif > 0 ? t('b.sarCap', { c: nf(s.critNotif, 1) }) : t('b.sarCapNeg', { x: nf(s.prep + s.travel, 1) });
  return '<div class="r-top"><span class="fig">' + nf(s.total, 1) + '</span><span class="of">' + esc(t('b.of', { l: '175' })) + '</span></div>' +
    '<div class="state-line status-' + stTone(level) + '">' + sign(level, 'sm') + esc(status) + '</div>' +
    budgetBar(parts, s.total, C.SAR_LIMIT, '175') + budgetLegend(parts) + '<p class="cap">' + esc(cap) + '</p>';
}

/** Keeps the category honest: the quadrant judges times only, so failed or incomplete rule checks are named beside it. */

function diagramBlock() {
  var c = activeRes();
  var k = S.dScen || c.governing.scenario;

    });

  document.addEventListener('input', function (e) {
    if (e.target.matches && e.target.matches('[data-path]')) {
      var tp = e.target.getAttribute('data-type');
      if (tp === 'select' || tp === 'check') { return; }
      try { onInput(e.target); } catch (err) { if (window.console) { console.error(err); } }
    }
  });
  document.addEventListener('change', function (e) {
    var tg = e.target;
    if (tg.matches && tg.matches('[data-path]') && (tg.getAttribute('data-type') === 'select' || tg.getAttribute('data-type') === 'check')) { onInput(tg); }
  });
  document.addEventListener('focusout', function (e) {
    if (e.target.matches && e.target.matches('[data-path]')) { onBlur(e.target); }
  });
  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (d && d.getAttribute && d.getAttribute('data-open-key')) { S.open[d.getAttribute('data-open-key')] = d.open; }
  }, true);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (pop) { closePopover(); return; }
      if ($('#modal')) { if (!pref.welcomed && $('[data-act="welcome-example"]')) { pref.welcomed = true; savePref(); } closeModal(); return; }
      closeMenus();
    }
    if (e.key === 'Enter' && e.target && e.target.id === 'verify-in' && (e.ctrlKey || e.metaKey)) { runVerify(); }
  });
  document.addEventListener('pointerover', function (e) {
    var el = e.target.closest && e.target.closest('[data-tip]');
    if (el) { showTip(el, e.clientX, e.clientY); }
  });
  document.addEventListener('pointermove', function (e) {
    var el = e.target.closest && e.target.closest('[data-tip]');
    if (el) { showTip(el, e.clientX, e.clientY); } else { hideTip(); }
  });
  document.addEventListener('pointerleave', hideTip);
  window.addEventListener('scroll', function () { hideTip(); if (pop) { closePopover(); } }, true);
  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').slice(1);
    if (PAGE[h] && h !== S.page) { go(h); }
  });
  var rt = null;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(drawCharts, 120); });
}

// ------------------------------------------------------------------ boot
function boot() {
  var draft = loadDraft();
  S.a = draft || E.example(S.lang);
  S.res = E.evaluate(S.a);
  var hash = (location.hash || '').slice(1);
  if (PAGE[hash]) { S.page = hash; }
  renderShell();
  renderTop();
  renderNav();
  renderPage(false);
  bindGlobal();
  if (/^FM[01]\.[A-Za-z0-9_-]+$/.test(hash) && window.FM_Report) {
    window.FM_Report.decodeCode(hash).then(function (a) {
      var fp = fingerprintOfDecoded(a);
      S._verified = E.normalize(a);
      openModal('<h2 id="modal-title">' + esc(t('link.title')) + '</h2><p>' + esc(t('link.body', { fp: fp })) + '</p><div class="modal-actions"><button class="btn" type="button" data-act="modal-close">' + esc(t('btn.cancel')) + '</button><button class="btn primary" type="button" data-act="verify-open">' + esc(t('verify.open')) + '</button></div>');
    }).catch(function () { toast(t('verify.bad'), true); });
  } else if (!pref.welcomed) {
    setTimeout(openWelcome, 350);
  }
  if (window.FM_SITE && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache is optional */ });
  }
  window.__firemar = { state: S, evaluate: function () { return S.res; }, helpers: helpers, load: loadAssessment, setLang: setLang, go: go };
}
if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', boot); } else { boot(); }

}());
